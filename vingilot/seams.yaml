    added: "2026-08-10"

  - path: "crates/buzz-acp/src/pool.rs"
    reason: "The other half of the fix, and without it the desktop half is decoration. Adds with_credentialed_shell, a [Tools] section prepended to the framed system prompt naming the MCP server whose shell tool carries the credentials. The base prompt tells the agent the buzz CLI is its interface and the credentials are env vars; an agent whose own shell strips them reads auth_error as 'I have no credentials' and stops, because nothing ever told it another shell existed. Emitted only when a session MCP server genuinely carries a non-empty BUZZ_PRIVATE_KEY (an agent without one must not be pointed at a tool it does not have) and only alongside a base prompt, which is what introduced the CLI the note is about. It names the server and reads its env list rather than assuming buzz-dev-mcp, so it cannot advertise a shell the harness was not given. Prepended beside [Workspace], the other section that grounds the base prompt in this machine rather than adding instructions of its own. No key is logged or formatted -- only the server's name."
    owner: "vingilot/agents"
    removable_when: "Upstream's base prompt itself describes the credentialed shell, or every harness carries its environment into its shell."
    status: "temporary"
    added: "2026-08-10"

  - path: "crates/buzz-acp/src/broker*"
    reason: "New, fork-owned: the send broker (broker.rs) and its tests (broker/tests.rs), covered by one glob because the tests are the module's own child file. It lives in buzz-acp because that is the process that already holds the agent's key and is already authenticated to the relay -- the whole point is that the key never leaves it, so the endpoint cannot live anywhere else. What it covers: a unix socket (mode 0600, in a per-harness directory created mode 0700) serving exactly one op, send_message, which builds a kind-9 channel message via buzz_sdk::build_message, signs it with the harness keys, and submits it through the existing RestClient -- the same sequence as pool::post_failure_notice, not a second implementation of signing. What it does NOT cover: it hands out no key material, signs no caller-supplied bytes or events, and proxies no relay reads; those three are refused by name so a caller is told the boundary is permanent rather than a missing feature. Its only relay read is fetching a reply target's thread root, which the caller cannot aim (no filter in, no result out). No key is logged, formatted, or returned on any path, and a test asserts that over every op the module recognises."
    owner: "vingilot/agents"
    removable_when: "Upstream adopts a credential broker of its own, or the CLI stops needing the harness to send on the agent's behalf."
    status: "temporary"
    added: "2026-08-10"

  - path: "crates/buzz-acp/src/lib.rs"
    reason: "Three touches, all wiring: `mod broker;`; binding the broker in run() once the relay's RestClient exists and logging its socket path (deliberately -- the path is not a secret, its protection is the directory mode, and an operator debugging a mute agent needs to know whether a broker exists); and threading the resulting BUZZ_BROKER_SOCKET env entry into PoolStartup::from_config so the spawned agent is told where to ask. The eager (non-lazy) pool initialisation moves from before the relay connect to just after it, because the socket path has to exist before the agent process is spawned and the broker's sink is the relay's own REST client. What this does NOT do: it does not put the private key anywhere new, does not change how the key reaches the agent today, and does not touch the lazy-pool or wake paths beyond passing the same env slice. A bind failure is logged and dropped, so a harness without a broker behaves exactly as it did before."
    owner: "vingilot/agents"
    removable_when: "The broker is started by something other than the harness's run loop, or upstream carries the wiring itself."
    status: "temporary"
    added: "2026-08-10"

  - path: ".github/workflows/vingilot-desktop.yml"
    reason: "The fork's own release build: GitHub's macOS runners are the only place a macOS .dmg can be produced, and Actions reads workflows from this fixed path, so it cannot live under vingilot/. The file is entirely fork-owned -- it adds a workflow rather than editing any of upstream's, and its tag pattern is vingilot-v* precisely so it cannot collide with upstream's release.yml (desktop-v[0-9]*) or docker.yml (relay-v[0-9]*), which this repo inherits and which a fork cannot complete. The build itself is vingilot/scripts/build-dmg.sh, so CI and a local build cannot drift."
    owner: "vingilot/brand"
    removable_when: "Never, while the fork ships an application of its own."
    status: "permanent"
    added: "2026-08-10"

  - path: "README.md"
    reason: "The first thing a stranger sees, and after the fork went public it had to say which of the two projects they are looking at. Upstream's text is kept because it is still true -- the relay, the event log, the agent harness, the CLI and the mobile app are upstream's and unmodified -- with a section added on top for what this fork adds, and the attribution and Apache 2.0 licence stated explicitly rather than left to be inferred. GitHub reads this path and no other."
    owner: "vingilot/brand"
    removable_when: "Never, while the fork is published under its own name."
    status: "permanent"
    added: "2026-08-10"
