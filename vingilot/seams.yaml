    reason: "The proof that the terminal surface is the app's rather than xterm's, on the terminal-wheel.spec.ts harness (real Terminal, real xterm, real work surface, IPC replaced by a recorder). Five things, none reachable from a unit test. (1) The palette, all four slots: xterm 5.5.0 defaults to a #ffffff foreground (browser/services/ThemeService.ts) and this component asks for a transparent background, which on the light themes is white text on 94.9% lightness -- the spec reads the computed colour off .xterm-rows, where xterm's DOM renderer writes the theme through a stylesheet it injects itself, and reads cursor, cursorAccent and the selection out of that same stylesheet's text (the elements those rules style are conditional: the cursor is a block only while the terminal holds focus and is animated between two colours while it blinks, and a selection rule styles nothing until something is selected). Every value is compared against what an element wearing the app's own Tailwind class resolves to in the same document, so no assertion can drift from whichever theme the e2e build boots in, and xterm's stock white and stock 30%-white-over-black selection are both named as values that must not come back. This is what caught the selection never having worked at all: it was probed as bg-primary/30, Tailwind compiles a slash opacity to color-mix(in oklab, ...), Chromium computes that to oklab(...), and xterm's css.toColor reads hex and rgb()/rgba() only -- so it threw, parseColor swallowed it, and every selection was drawn in xterm's grey. (2) The palette is a live reading: the spec rewrites --foreground/--primary/--background as inline custom properties on the root element, exactly the way ThemeProvider.tsx switches a theme, and polls that all four slots followed. --primary is set to yellow on purpose, because rgb(255, 255, 0) is an opaque colour whose blue channel is 0 -- the shape a transparency test written as a string pattern silently discards. (3) The active tab is marked by an attribute AND the marking costs no pixel: the tab's box is measured before and after it stops being active, which is what pins the choice to draw the ring on every tab and make it transparent on the inactive ones rather than to add a border. (4) Overflow: tabs are opened until the strip really overflows (asserted, so the test cannot pass by never reaching the state it is about), then the new-tab button is asserted to be outside the scroller and still in the viewport, and a tab that is off screen is selected WITH THE KEYBOARD (alt-cmd-left) and asserted to have been brought to the scroller's right edge by exactly the smallest movement that shows it. The keyboard rather than a click because Playwright runs scrollRectIntoViewIfNeeded on a click's target as part of its actionability checks, walking every scrollable ancestor including this scroller -- a clicked assertion holds with the component's effect deleted, and the keyboard is the act the effect exists for anyway. (5) The scrollback affordance: 400 lines are fed to the pty, the xterm viewport is scrolled to the top through the same scroll event a wheel takes when tmux is not holding the history, and the control is asserted to appear carrying the distance as data-lines-behind and to be gone after a click. All five are facts about laid-out boxes and resolved style in an assembled app. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
    owner: "vingilot/runs"
    removable_when: "Never, while the terminal takes its colours from the app's theme and its tabs can outnumber the strip."
