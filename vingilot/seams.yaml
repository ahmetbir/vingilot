/plans/2026-08-09-keys-and-type.md, Task 1); and projects_load/projects_save (vingilot/docs/plans/2026-08-10-coordinator-optional.md, Task 1), which read and write the local project list at ~/.vingilot/projects.json -- the change that lets a machine with no coordinator hold a project at all, since until then the list existed only inside the coordinator's workspace document. That plan also rewrites the one existing block in this file that ⌘W runs through: the macOS RunEvent::WindowEvent CloseRequested arm, which used to hide the main window and is the reason the owner lost his window to ⌘W with no way back he could find. It now asks vingilot_window::resolve_close_request what the request means and either forwards it to the webview or minimizes -- and never hides. The arm has to be here because RunEvent is delivered to the single app.run closure, which upstream owns; the decision it takes is fork-owned and pure, in vingilot_window. One further line in setup() starts vingilot_pty::sweep_orphaned_terminals on its own thread (vingilot/docs/plans/2026-08-11-one-column-and-loose-ends.md, Task 2) -- it must run at app start rather than be a command the webview calls, because the whole point is to reach tmux sessions the webview has no record of. And worktree_tree/file_read (vingilot/docs/plans/2026-08-11-what-sent-him-to-vscode.md, Task 3), which list one directory level of a worktree and read one file under hard bounds, so the Files pane can show a checkout without leaving the app. And worktree_search (same plan, Task 2), which runs one git grep over a worktree under a hit cap, a byte budget and a killable deadline, so cmd shift f finds a thing in the checkout without leaving the app -- registered from vingilot_search rather than vingilot_files because the two modules bound their subprocesses differently (see that island entry). And worktree_log/commit_diff/worktree_status (same plan, Task 4), the three reads behind the History pane: one bounded page of git log paged by before-cursor, the patch of one commit in the very same WorktreeDiff shape worktree_diff answers so one renderer draws both, and git's four status columns parsed out of --porcelain=v2 -z. All three are READS and each of their modules carries a test that fails a future edit reaching for a write verb -- the plan drew the line at showing state rather than changing it, so no fourth command for staging, committing or discarding is registered here or exists to be. And mod vingilot_scratch; plus scratch_read/scratch_write (vingilot/docs/plans/2026-08-12-vscode-muscle-memory.md, Task 4), the two commands behind the scratch markdown buffer -- three lines, the smallest touch a new island can make here, and both commands take NO path: the read takes nothing at all and the write takes only the text, so this table cannot be used to name a file. Nothing else about the buffer is here. The CloseRequested arm named above was also EMPTIED into vingilot_window::apply_close_request by that same task, and the reason is this file: it is the one Tauri gives an app for its command table and its run loop, every fork command costs it a line, and at 999 of the repository ratchet's 1000 the next island to need one had nowhere to put it. Twenty-eight lines of it were fork logic that this entry already described as "fork-owned and pure, in vingilot_window" -- the arm stays, because RunEvent is delivered to this closure and nowhere else, and everything inside it moved. The house rule is split, never raise; this is the split."
