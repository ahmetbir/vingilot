    reason: "The proof that ctrl-Tab takes him back to where he was (vingilot/docs/plans/2026-08-12-vscode-muscle-memory.md, Task 3). The pure halves are proved without a browser and deliberately kept there: desktop/src/features/runs/lib/placeMru.test.mjs owns the list (a place is worktree + pane + file, the dedupe that makes a second tap come back rather than go on, the cap at 12 with the oldest falling off, both wraps, and that a tap and a hold are one reducer rather than two rules); placeKeys.test.mjs owns the chord and everything it refuses, including that this is the one map in the island reading a raw ctrlKey instead of the platform's primary modifier and that ctrl on any other key falls straight through to the shell. Five readings only a browser can give. (1) The trail is built by NAVIGATION and the browser is the only place the navigation exists -- a worktree row clicked, a pane chosen from the picker, a file opened in the tree, three code paths in three components that the model cannot see -- so it is read back as the rows the overlay draws, in order, with the cursor on row 1 after one press because row 0 is where he already is. (2) The chord ARRIVES, pressed with keyboard.down('Control') rather than press(), because the whole gesture is HOLDING a modifier and a press would release it before the overlay could exist; a claimant check is a reading of source and cmd W was lost for want of a press. (3) The overlay is the top layer over a hosted channel surface, hit-tested every 12px across the whole right pane -- the same reading workspace-palette-over-thread.spec.ts takes of cmd K, taken again because the defect it was written for (a pane's z-40 chrome outranking a z-30 overlay) is a property of the BOX and not of the palette, so a second overlay that got its own z wrong would fail in no other spec. (4) A focused xterm does not swallow it: @xterm/xterm 5.5.0's common/input/Keyboard.ts case 9 ignores ctrlKey entirely and resolves ctrl-Tab to a literal tab it writes to the pty and then cancels, on a listener registered on its own textarea -- nothing in a unit test can see a window-capture listener beating that. (5) The palette keeps the keyboard while it is open and the chord comes back when it closes, which is the half that fails silently: this island's listener is bound for the life of the screen and the palette's when the palette opens, so on registration order alone this one would win. Two worktrees are seeded rather than one, because a place is worktree + pane and a switcher proved over a single checkout proves half of it. Runs at 1728x1117, the 16-inch MacBook Pro's own resolution, the width every spec in this plan reads its panes at. worktree_tree and file_read are stubbed through the same addInitScript property trap workspace-one-column.spec.ts documents, and everything else falls through to the mock bridge, which is what lets one harness serve the Files pane and a real hosted channel. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
