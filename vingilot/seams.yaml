  - path: "desktop/tests/e2e/workspace-readme-shots.spec.ts"
    reason: "The three workspace pictures the README shows, produced by a spec rather than taken off a machine. The README's problem was that every screenshot in it was upstream's chat, so a stranger could not see the thing this fork adds; a photograph of the owner's screen would have put his paths, his repositories and his keys in a public README and would rot the moment a pane moved. So the state is seeded here over the mock bridge -- three projects, six worktrees in every status the coordinator can report, a four-file patch, a shell transcript and an exchange between two agents, all invented, none of them naming any person, host, repository or key that exists. It is a spec and not a screenshot script: each capture is gated on assertions that its subject actually reached the screen (nine board rows and the headline over them; the changed file names AND the fix's own line in the patch column beside them; both agents' sentences in the thread; this arrangement's bytes in the terminal, not the other one's), plus one geometric assertion that the right-hand pane is wide enough to read a patch in -- the failure that assertion exists for is invisible to every text assertion, because the patch is in the DOM at any width. It also puts away what a still picture cannot survive: the one-time import notice, the unread pill (dismissed by reading to the end, the gesture that retires it), and the hover action bar the wheel gesture leaves lit. Proved able to fail: three product breaks, one per picture -- the board's rows sliced to three, the Diff pane handed an empty patch body, and the team pane pointed at a channel that is not this worktree's thread -- each turning exactly the intended test red and neither of the others. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
