  - path: "desktop/tests/e2e/workspace-overlap.spec.ts"
    reason: "The proof that the cross-worktree conflict early warning reaches the screen -- two worktrees of one project that have changed the same file, said before either merges, which no shipping product does today. The pure halves are proved without a browser and deliberately kept there: desktop/src/features/runs/lib/worktreeOverlap.test.mjs owns the pairwise intersection, the singular/plural, the peer ordering, the 'at least' of a truncated list, and the rule that a worktree nothing has answered about is neither a mark-holder nor a peer; worktreeStat.test.mjs owns the boundary rule underneath it, that a record carrying no paths reads as null and never as an empty set (an empty set silently AGREES it shares no files, which is a claim nothing made). Four readings only a browser can give. (1) The mark reaches the row at all, carrying the model's own count -- a model that is correct and never rendered is a failure this island has already had. (2) The sentence is on the row in words, and each side names the OTHER worktree; the mark is aria-hidden, so the row's title is the only accessible rendering of it, and a symmetric bug in which both rows name themselves fails exactly here. (3) A worktree that has not answered draws nothing and is named by nobody, asserted over the two ways that happens in practice: one worktree is simply absent from the stat batch (git never answered), and one comes back marked unreadable while carrying a path list that WOULD collide with both other rows. That second fixture is a shape the backend never produces (stat.rs's unreadable() sends an empty list) and is chosen because it discriminates: a build reading the raw stat instead of usableStat lights up three rows and turns this red, where a realistic fixture would pass either way. (4) The overlap is NOT a fifth attention state -- both overlapping rows still report data-attention=dirty, and the attention sentence survives alongside the overlap sentence rather than being replaced by it. That is the design constraint argued in lib/worktreeOverlap.ts's header (an overlap is a property of a PAIR of trees, nothing is blocked on it, and it has no place in a precedence built from 'what changes next if nothing is done'), turned into an assertion a later simplification cannot quietly undo. worktree_stats is stubbed through the same addInitScript property trap workspace-one-column.spec.ts documents (the bridge assigns invoke during boot and the home-dir lookup runs on the first render, so an override installed after boot is too late); real git is driven instead by vingilot_worktree/stat.rs's own cargo tests against temp repositories, which is where 'does git name the changed files' is proved, so nothing here is a property of whatever happened to be in a temp directory. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
    owner: "vingilot/runs"
    removable_when: "Never, while the workspace warns about cross-worktree conflicts before merge."
    status: "permanent"
    added: "2026-08-12"

  - path: "desktop/tests/e2e/workspace-no-coordinator.spec.ts"
    reason: "The proof that the workspace works on a machine with NO control plane at all (vingilot/docs/plans/2026-08-10-coordinator-optional.md, Task 3) -- the case the owner hit on his work Mac and the one no spec covered. Every other workspace spec in this directory mocks a coordinator that answers, so all of them passed while the product was unusable on any machine but the Mac mini; here every request to 127.0.0.1:7117 is aborted at the transport, which is what a closed port does and what coordinatorClient.ts reads as unreachable. Five readings, none of them reachable from a unit test because each is about a state the whole screen holds at once: the workspace opens with nothing to render it from; a project can be added (the act that used to be a CAS write into a workspace document that was not there); it survives a reload; the worktree column still lists, and its non-main row can only have come from worktree_list because the coordinator's worktrees endpoint never answers here; and the banner carries data-state=absent with neither the word read-only anywhere on screen nor a retry countdown. The project file is deliberately NOT held in the page -- projects_load/projects_save cross into the test process through page.exposeFunction -- so 'survives a reload' means what it means on his disk rather than what a surviving React tree would mean. The Tauri surface is installed as a property trap in an init script rather than by overwriting invoke after boot, because projects_load runs on the first render and a rejection there is remembered for the session as 'no local store on this machine'. Proved able to fail: four product breaks (controlPlaneKind forced to outage; the git listing dropped from withLocalGroups; readLocalProjects always answering the empty document, so the file is written and never read back; and addProject re-gated on a reachable coordinator, the original bug), each turning exactly the intended assertion red. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
    owner: "vingilot/runs"
