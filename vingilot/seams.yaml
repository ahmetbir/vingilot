    reason: "The newest fork-owned island inside the Rust side -- the tenth directory under desktop/src-tauri/src this fork owns outright (vingilot/docs/plans/2026-08-12-vscode-muscle-memory.md, Task 4): the bytes of the scratch markdown buffer, at ~/.vingilot/scratch.md, beside vingilot_projects' own projects.json. It must live on the Rust side for that module's reason -- the webview has no filesystem access, @tauri-apps/plugin-fs is neither a dependency nor a granted capability -- and a file rather than localStorage for that module's reason too: a webview data reset clears that store silently, and the owner can neither open the buffer in his own editor nor put it in a backup, which is half of what a scratch buffer is for. THE PATH IS NOT A PARAMETER IN EITHER DIRECTION, and that is the whole of the path safety here: scratch_read takes no arguments and scratch_write takes only the text, so there is no caller-supplied path to canonicalise, no .. to refuse and no symlink check to get wrong -- vingilot_files::inside exists because that module's callers name a file, and this one closes the route instead of guarding it. IT NEVER LEAVES THIS MACHINE, said in the module header as a decision rather than an omission: this app is a relay client with a websocket, an event-kind registry and a media uploader, and a work machine's scratch buffer is where a password is pasted while it is being moved and where half a postmortem sits before anyone has decided whether it is shareable. Nothing in the module opens a socket, features/runs/lib/scratchClient.ts calls exactly these two commands, and desktop/tests/e2e/workspace-scratch-markdown.spec.ts asserts the canary in the typed text reaches no fetch body, no WebSocket frame and no other invoke. Bounds modelled on vingilot_files/read.rs: the size is checked with metadata before the open so a file somebody grew to a gigabyte costs one stat, and the read itself stops one byte past the 256 KiB ceiling because a stat is stale the moment it answers -- with the ceiling DERIVED (MAX_DOCUMENT_CHARS is 40 000, four bytes a character at worst, so no buffer this app can produce is ever refused) rather than picked. The write refuses past the ceiling instead of truncating, because truncating is losing the work the feature exists to keep, and it publishes through a sibling temp path and a rename so an interrupted save leaves the previous buffer whole rather than a partial one. Not-there and could-not-be-read are kept apart (Ok(None) for NotFound alone), which is what permits the first write and forbids autosaving over a file this build merely could not open; not-UTF-8 is a REFUSAL here where read.rs decodes lossily, because a reader can afford replacement characters and an autosave that rewrites the whole file cannot. Both commands are async, so a file rewritten every few hundred milliseconds while he types is not written on the thread the webview talks on -- the terminal beside the buffer staying responsive is the product. Additive-only new directory under the upstream desktop/src-tauri/src tree; no existing file is renamed or deleted, so it cannot merge-conflict."
