  - path: ".github/workflows/vingilot-desktop.yml"
    reason: "The fork's own release build and, since 2026-08-11, the fork's own gates. Actions reads workflows from this fixed path, so none of it can live under vingilot/, and GitHub's macOS runners are the only place a macOS .dmg can be produced. The file is entirely fork-owned -- it adds a workflow rather than editing any of upstream's, and its tag pattern is vingilot-v* precisely so it cannot collide with upstream's release.yml (desktop-v[0-9]*) or docker.yml (relay-v[0-9]*), which this repo inherits and which a fork cannot complete. The build itself is vingilot/scripts/build-dmg.sh, so CI and a local build cannot drift. Three gate jobs, because this repo ran no checks of its own at all: `seams` runs check-seams.sh --self-test and then the gate against upstream/main -- the only thing anywhere that invokes it, which is why the registry's header can now say CI enforces it and be true; `lint-root` and `lint-desktop` run cargo fmt --check and cargo clippy --all-targets -- -D warnings over the two workspaces (the root one, and desktop/src-tauri, which the root workspace excludes) on ubuntu-latest, since code guarded for one platform and compiled only on the owner's Mac is exactly what escaped. Two lint jobs rather than one, each with mold and each on the timeout upstream measured for the same work (30 and 45 minutes), so a cold first run cannot fail as a timeout with no findings. All three run on pull_request and on a push to vingilot-ci; the dmg job is gated to tags and dispatches, so neither a PR nor that branch starts a 90-minute signed build. Every job is additionally gated on github.repository_owner == ahmetbir: a pull_request workflow runs from the merge commit, so without that guard a fork-to-upstream PR would carry the fork's gates into block/buzz's CI. The OWNER rather than the full owner/name deliberately -- a skipped job reports green with no work done, so anything that falsifies that condition disables every gate here silently, and a repository rename would do exactly that while changing nothing the guard is about."
    owner: "vingilot/ci"
