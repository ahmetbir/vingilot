# ==============================================================================
# Vingilot seam inventory
# ==============================================================================
#
# Per ADR-001 (docs/adr/ADR-001-product-composition-and-upstream-boundary.md),
# decision 6: all fork-owned code lives under vingilot/. Any change to a path
# OUTSIDE vingilot/ is an upstream touch, and is permitted only if it is
# declared here as a "seam".
#
# This file exists to make every upstream touch a reviewed, explained
# decision (ADR-001, Consequences) rather than an incidental diff.
#
# ------------------------------------------------------------------------------
# What enforces it (be exact: this said "in CI" for months while nothing ran it)
# ------------------------------------------------------------------------------
#
# vingilot/scripts/check-seams.sh fails a branch or working tree that touches a
# non-vingilot/ path no entry below declares. Two things invoke it, and they run
# the same two commands so a local pass means the same thing as a CI pass:
#
#   just seams                                  (local, run by hand)
#   the `seams` job of .github/workflows/vingilot-desktop.yml
#
# That is the complete list. In particular NO GIT HOOK runs it: lefthook.yml's
# pre-push commands are branch-skew, desktop-check, desktop-tauri-checks,
# desktop-test, mobile-test and rust-tests, and none of them is this gate. That
# is a choice, not an omission — the gate resolves its base ref through the
# `upstream` remote, and lefthook runs on every machine that pushes this repo,
# including checkouts that have only `origin`. On one of those the hook would
# fail for a reason unrelated to the push. So CI is the invocation that runs
# unconditionally, and `just seams` is the one you run before you get there.
#
# Both run `check-seams.sh --self-test` before the gate itself. The gate's whole
# value is rejection, so the rejection path is the part that needs a test; the
# self-test drives the matcher, the allow/reject decision, the change-collection
# pipeline and the guards on this file set, with no git history and no writes
# outside its own temp fixtures.
#
# And this paragraph is itself asserted. Self-test block 4 greps the workflow for
# the two `run:` lines and the Justfile for the `seams:` recipe that calls both,
# because "nothing runs the gate" is the one regression this repo has already
# lived through — it is what the parenthesis in the heading above refers to.
# Deleting either invocation now fails the self-test rather than quietly
# returning the registry to decoration.
#
# ------------------------------------------------------------------------------
# Where the entries live
# ------------------------------------------------------------------------------
#
# The registry is this file plus every vingilot/seams/*.yaml fragment. A
# fragment is an ordinary seam file — same format, same parser, no
# schema_version of its own — and they are globbed, so adding one needs no
# change to any script. There is one today: vingilot/seams/brand-sweep.yaml.
#
# Split rather than grow: the house rule is 1000 lines per file, ratcheted, and
# check-seams.sh refuses a registry file over that ceiling (the desktop
# file-size ratchet cannot see this tree — it scans .ts/.tsx/.rs/.css under
# desktop's source roots — so the ceiling is enforced by the script that already
# reads these files). Move a block of entries into a new
# vingilot/seams/<topic>.yaml; never raise the number.
#
# ------------------------------------------------------------------------------
# Format (read this before adding an entry)
# ------------------------------------------------------------------------------
#
# schema_version: integer. Bump only if the record shape below changes in a
#   way check-seams.sh must also understand (it parses this file itself).
#
# seams: a YAML list. Each item is one seam and MUST use exactly this shape —
#   check-seams.sh parses it with grep/sed, not a YAML library, so the format
#   is deliberately narrow:
#
#   - path: "<pattern>"
#     reason: "<why this upstream path must be touched>"
#     owner: "<who is responsible for this seam existing>"
#     removable_when: "<the condition that lets this entry be deleted>"
#     status: "temporary" | "permanent"
#     added: "<YYYY-MM-DD>"
#
# Hard rules the parser depends on:
#   1. `path` is always the first key of the entry, on the same line as the
#      leading `- `, e.g.: `  - path: "desktop/package.json"`.
#   2. Every field value is a plain double-quoted string on a single line.
#      No single quotes, no unquoted scalars, no YAML block/flow scalars
#      (`|`, `>`, `[...]`, `{...}`). If a value needs a literal `"`, this
#      format cannot express it — reword instead.
#   3. `path` may be a literal path or a glob, with filesystem segment
#      semantics:
#        `*`  matches any run of characters WITHIN ONE path segment, never `/`
#        `**` matches any run of characters, crossing `/`
#        `?`  matches exactly one character, never `/`
#      So `desktop/ds-*` matches `desktop/ds-entry.tsx` and NOT
#      `desktop/ds/deep/file.ts`; a whole subtree is `desktop/ds/**`.
#      Prefer the narrowest pattern that covers the real set of files, and
#      prefer enumerating files over a `**` you do not need.
#
#      This was bash `case`-glob matching until 2026-08-11, where `*` crossed
#      `/` — which meant two blanket entries, `desktop/src/*` and
#      `desktop/tests/e2e/*`, pre-authorised every file in both trees forever
#      and the gate could not reject anything there. `touch
#      desktop/src/__probe.txt` passed. If you are tempted to widen a pattern
#      to make the gate quiet, that is the failure mode you would be
#      recreating; add the file instead.
#   4. Anything already under `vingilot/` is always allowed and never needs
#      an entry — the checker special-cases that prefix.
#   5. `status: "temporary"` means this seam is an accommodation we intend to
#      remove (per `removable_when`), not a designed part of the boundary.
#      `status: "permanent"` means the seam is expected to persist for as
#      long as the fork does.
#
# Adding an entry is a decision, not a chore (ADR-001, Consequences) — say
# in `reason` why the touch is unavoidable at this path specifically, not
# just what the change does.
#
# ------------------------------------------------------------------------------

schema_version: 1

seams:
  - path: ".gitignore"
    reason: "Adds ignore patterns for the design-sync tool's ephemeral build/cache output (.ds-sync/, ds-bundle/, .design-sync/.cache/, .design-sync/learnings/, .design-sync/node_modules, desktop/ds-compiled.css, desktop/ds-types/) so its generated artifacts never get committed."
    owner: "design-sync tooling (external design-publishing pipeline; not owned by Vingilot engineering)"
    removable_when: "The design-sync integration is retired, or its build/cache output is produced under a vingilot/-rooted workspace instead of the repo root."
    status: "temporary"
    added: "2026-08-01"

  - path: "desktop/package.json"
    reason: "Adds a types field (ds-types/index.d.ts) so the design-sync converter can read each shared UI component's real prop types instead of falling back to an empty interface. Inert for the app itself: nothing imports buzz as a package. Also adds @xterm/xterm and @xterm/addon-fit (vingilot/docs/plans/2026-08-06-projects-and-terminal.md, Task 4) -- the plan's second and last named dependency, rendering the PTY's VT output in the Terminal tab; the alternative is writing a terminal emulator by hand."
    owner: "design-sync tooling (external design-publishing pipeline; not owned by Vingilot engineering)"
    removable_when: "Design-sync no longer needs a types entry point on the desktop package (e.g. it reads declarations from a fork-owned adapter instead), or the design-sync integration is retired."
    status: "temporary"
    added: "2026-08-01"

  - path: "pnpm-lock.yaml"
    reason: "The pnpm workspace lockfile lives at the repo root (pnpm-workspace.yaml lists desktop/web/admin-web as members), not inside desktop/ -- so any dependency change to desktop/package.json necessarily regenerates this file too. Currently reflects @xterm/xterm and @xterm/addon-fit (vingilot/docs/plans/2026-08-06-projects-and-terminal.md, Task 4), the plan's second and last named dependency."
    owner: "vingilot/runs"
    removable_when: "Never, while any desktop/package.json dependency change is possible -- the lockfile is regenerated mechanically alongside it."
    status: "permanent"
    added: "2026-08-06"

  - path: "desktop/ds-*"
    reason: "Hand-written entry point (ds-entry.tsx), Tailwind entry (ds-styles.css), and their gitignored build output (ds-compiled.css, ds-types/) that the design-sync tool bundles to publish desktop/src/shared/ui components. Must live inside desktop/ today because the tool's package-build.mjs derives its package root by walking up from the entry file to the nearest package.json with a name field (see .design-sync/NOTES.md). Deliberately narrow (not desktop/*ds-*): a broader glob would also match unrelated upstream files like desktop/tests/e2e/needs-restart-screenshots.spec.ts."
    owner: "design-sync tooling (external design-publishing pipeline; not owned by Vingilot engineering)"
    removable_when: "These files ideally live under vingilot/ instead. Removable once the design-sync tool no longer requires them to be colocated with desktop/package.json for package-root resolution, or once the design-sync integration is retired."
    status: "temporary"
    added: "2026-08-01"

  - path: "desktop/tsconfig.ds-*"
    reason: "Declaration-emit tsconfig (tsconfig.ds-types.json) the design-sync tool runs to extract real prop types for each component (see desktop/package.json's types entry above). Kept as its own pattern rather than folded into desktop/ds-* because its filename doesn't start with ds- (it starts with tsconfig.)."
    owner: "design-sync tooling (external design-publishing pipeline; not owned by Vingilot engineering)"
    removable_when: "This file ideally lives under vingilot/ instead. Removable once the design-sync tool no longer requires it to be colocated with desktop/package.json for package-root resolution, or once the design-sync integration is retired."
    status: "temporary"
    added: "2026-08-01"

  - path: ".design-sync/**"
    reason: "The design-sync tool's own config (config.json), authored preview cards, component doc stubs, conventions doc, and sync notes, at the fixed repo-root path the tool expects."
    owner: "design-sync tooling (external design-publishing pipeline; not owned by Vingilot engineering)"
    removable_when: "This directory ideally lives under vingilot/ instead. Removable once the design-sync tool's fixed-path assumption is relaxed (e.g. a configurable root) and the tree is relocated, or once the design-sync integration is retired."
    status: "temporary"
    added: "2026-08-01"



  - path: "desktop/src/features/runs/**"
    reason: "Per ADR-001's 2026-08-03 reversal, the Runs island (coordinator client, ported pure logic, and the Runs screen UI) is a new fork-owned directory inside the upstream desktop tree. Additive only: no upstream file is renamed or deleted, so this cannot merge-conflict."
    owner: "vingilot/runs"
    removable_when: "Never, while Runs ships as an island inside Buzz desktop."
    status: "permanent"
    added: "2026-08-03"

  - path: "desktop/src/features/communities/useCommunityInit.ts"
    reason: "One import and one call added to resetCommunityState(): resetFileTargets(), the Files pane's outside route (features/runs/lib/filesTarget.ts, vingilot/docs/plans/2026-08-12-files-pane-design.md section 6). This file is the single list upstream keeps of every module-level singleton that has to be dropped when the community changes, and the repository's own CLAUDE.md states adding to it as a MUST for any new module-level cache holding community-scoped data -- switching communities does not reload the page, it remounts the React subtree under <AppReady key={communityKey}>, and a module-level value survives that. filesTarget.ts holds exactly such a value: a pending FileTarget names a WORKTREE, and a target filed against a checkout in the community just left must not still be waiting when the next community's Files pane mounts and calls pendingFile() on mount. There is no smaller seam: resetCommunityState is a private function in this file, the list is a sequence of direct calls with no registration hook to call from the island side, and every other reset in it (resetRateLimitGate, resetAgentObserverStore, resetVideoPlayerState, clearMarkdownNodeCache and nine more) is wired the same way -- the precedent is the entire body of the function. One added line in an existing list, in the position the list's own feature ordering puts it (after features/profile, before features/sidebar), plus the matching import. Nothing upstream-owned changes behaviour: the added call clears only the island's own store."
    owner: "vingilot/runs"
    removable_when: "The Files pane's target store stops being module-level, or upstream grows a registration hook that lets a feature declare its own community-scoped reset without editing this list."
    status: "permanent"
    added: "2026-08-12"

  - path: "desktop/src/app/routes.ts"
    reason: "Registers the one new route entry (\"/workspace\" -> \"workspace.tsx\") in the virtual file-route tree so the island's screen mounts in the main pane. Smallest possible touch: one line in an existing list. The path is /workspace, not /projects: upstream already owns /projects and /projects/$projectId in this same list for its relay-hosted repo feature (vingilot/docs/plans/2026-08-07-workspace-v1.md, Task 5)."
    owner: "vingilot/runs"
    removable_when: "Never, while a /workspace route exists in Buzz desktop."
    status: "permanent"
    added: "2026-08-03"

  - path: "desktop/src/app/routes/workspace.tsx"
    reason: "New route file for \"/workspace\" (renamed from runs.tsx in Task 5, when the route moved off /runs). TanStack's virtual file-route generator requires the route component to live in this fixed upstream directory (desktop/src/app/routes/) alongside agents.tsx/workflows.tsx; it lazy-loads the island's RunsScreen and adds no other logic, matching the sibling route files' idiom."
    owner: "vingilot/runs"
    removable_when: "Never, while a /workspace route exists in Buzz desktop."
    status: "permanent"
    added: "2026-08-03"

  - path: "desktop/src/app/routes/runs.tsx"
    reason: "The source side of the routes/runs.tsx -> routes/workspace.tsx rename (Task 5). No such file exists at HEAD; this entry is here only because check-seams.sh checks BOTH sides of a rename (see its parse_diff and its --help text), so the deleted path is still a declared touch while the rename sits in the working tree or in a commit ahead of the base ref. Once the rename is in the base ref, runs.tsx is in neither tree of the branch diff and this entry is dead."
    owner: "vingilot/runs"
    removable_when: "The routes/runs.tsx -> routes/workspace.tsx rename has merged into the branch's base ref, after which the path appears in no diff check-seams.sh reads."
    status: "temporary"
    added: "2026-08-07"

  - path: "desktop/src/app/routeTree.gen.ts"
    reason: "Auto-generated by TanStack Router's route-tree generator whenever routes.ts or a routes/*.tsx file changes. Declaring \"/workspace\" in routes.ts regenerates this file with the matching workspaceRoute entries; hand-editing it is not an option, it is build output that must be committed as-is."
    owner: "vingilot/runs"
    removable_when: "Never, while a /workspace route exists in Buzz desktop."
    status: "permanent"
    added: "2026-08-03"

  - path: "desktop/src/app/AppShell.helpers.ts"
    reason: "deriveShellRoute()/AppView need a \"workspace\" case so the shell resolves /workspace to the island's view for sidebar active-state highlighting, the same way it already resolves /agents and /workflows. The case was named \"runs\" until Task 5 renamed the route; same line count, one token per line."
    owner: "vingilot/runs"
    removable_when: "Never, while a /workspace route exists in Buzz desktop."
    status: "permanent"
    added: "2026-08-03"

  - path: "desktop/src/app/AppShell.tsx"
    reason: "Wires the island's nav callback (onSelectWorkspace={() => void goWorkspace()}) into the sidebar, matching onSelectAgents/onSelectWorkflows immediately above it — plus one destructuring line pulling goWorkspace out of useAppNavigation()'s return. (Both were named *Runs until Task 5 renamed the route to /workspace; a token rename, not a line change.) AppShell.tsx sits at the desktop file-size ratchet's cap (999 lines, both before and after this change); to add those two lines without growing the file past 999, an existing three-line onSetPresenceStatus={(status) => presenceSession.setStatus(status)} arrow wrapper was collapsed to the equivalent one-line onSetPresenceStatus={presenceSession.setStatus} (presenceSession.setStatus already has the (status) => void signature the prop expects, so this is a behavior-preserving simplification, not a functional change). Net diff: 3 insertions, 3 deletions; file stays at 999 lines. It is not grown beyond that for this task."
    owner: "vingilot/runs"
    removable_when: "Never, while a /workspace route exists in Buzz desktop."
    status: "permanent"
    added: "2026-08-03"

  - path: "desktop/src/app/navigation/useAppNavigation.ts"
    reason: "Adds a goWorkspace() navigation callback alongside goAgents/goProjects/goPulse/goWorkflows, following the same commitNavigation({ to: \"/workspace\" }) pattern. Named goRuns against /runs until Task 5 renamed the route."
    owner: "vingilot/runs"
    removable_when: "Never, while a /workspace route exists in Buzz desktop."
    status: "permanent"
    added: "2026-08-03"

  - path: "desktop/src/features/sidebar/ui/AppSidebar.tsx"
    reason: "Threads an onSelectWorkspace prop from AppShell down to AppSidebarPrimaryMenu, the same passthrough already done for onSelectAgents/onSelectProjects/onSelectPulse/onSelectWorkflows, and adds \"workspace\" to the selectedView union. Both were named *Runs/\"runs\" until Task 5 renamed the route."
    owner: "vingilot/runs"
    removable_when: "Never, while a /workspace route exists in Buzz desktop."
    status: "permanent"
    added: "2026-08-03"

  - path: "desktop/src/features/sidebar/ui/AppSidebarPinnedHeader.tsx"
    reason: "Renders the island's sidebar nav item (icon + label + active state) in AppSidebarPrimaryMenu, alongside Inbox/Pulse/Repos/Agents/Workflows. It also carries the one-string half of the Projects/Repos naming call (vingilot/docs/plans/2026-08-07-workspace-v1.md, The naming collision): the island's item is labelled Projects, and upstream's own nav item is relabelled Repos -- which is literally what that screen lists, relay-hosted repositories. Only the label and tooltip text change for upstream's item; its data-testid, its route, its FeatureGate, its icon, and every screen behind it are untouched, so no upstream test or behaviour moves and the relabel is reversible by editing two words."
    owner: "vingilot/runs"
    removable_when: "Never, while a /workspace route exists in Buzz desktop."
    status: "permanent"
    added: "2026-08-03"

  - path: "desktop/tests/e2e/deck-two-devices.spec.ts"
    reason: "Task 4's E2E proof (vingilot/docs/plans/2026-08-04-deck-phase-3.md) that the pin set syncs across devices while the pin arrangement stays device-local. Lives at the upstream-owned desktop/tests/e2e/ path because that is where every Playwright spec in this repo lives and where playwright.config.ts's testDir points; a fork-owned location would need its own testDir/project wiring for one file. Also carries the /runs -> /workspace route rename (vingilot/docs/plans/2026-08-07-workspace-v1.md, Task 5): three goto() strings, changed for the same reason every other route seam was."
    owner: "vingilot/runs"
    removable_when: "Never, while Deck's two-device split needs an E2E regression spec."
    status: "permanent"
    added: "2026-08-04"

  - path: "desktop/tests/e2e/workspace-no-overlays.spec.ts"
    reason: "Task 1c's regression guard (vingilot/docs/plans/2026-08-07-panes-and-polish.md): with a project open and a real xterm mounted, no element outside the work surface may paint on top of it -- read twice, once by hit testing every 16px of the surface and once by geometry over every overlapping box that carries its own text or graphic. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason deck-two-devices.spec.ts does: that is where playwright.config.ts's testDir points, and the assertion is about the whole rendered app shell, so it cannot be expressed as a unit test inside the island."
    owner: "vingilot/runs"
    removable_when: "Never, while the work surface must stay free of other features' overlays."
    status: "permanent"
    added: "2026-08-07"

  - path: "desktop/tests/e2e/workspace-columns.spec.ts"
    reason: "Task 6's proof (vingilot/docs/plans/2026-08-07-panes-and-polish.md) that the collapse chords actually arrive and that a hidden column is never a trap: Cmd-B is asserted against upstream SidebarProvider's own data-state, Shift-Cmd-B against the worktree column plus the rail button that brings it back, and both against a reload and a second project. Cannot be a unit test inside the island: what is under test is whether a window-level chord reaches a provider the screen must be mounted inside -- the exact failure mode that lost Cmd-W to the native menu, and one that a resolveKey test cannot see. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other two fork specs do: that is where playwright.config.ts's testDir points."
    owner: "vingilot/runs"
    removable_when: "Never, while the workspace's columns collapse on keyboard shortcuts."
    status: "permanent"
    added: "2026-08-07"

  - path: "desktop/tests/e2e/workspace-one-column.spec.ts"
    reason: "Task 1's proof (vingilot/docs/plans/2026-08-11-one-column-and-loose-ends.md, design at vingilot/docs/plans/2026-08-11-one-column-design.md) that merging ProjectsNav into WorktreeColumn really gave the work surface the 192px the second column was spending: at the 1728x1117 logical resolution of the owner's 16-inch MacBook Pro the nav measures 224px, the work surface clears 1190 where it used to be 1003, and sidebar + nav + surface sums to the window -- a self-checking reading that catches a third column reappearing without anyone maintaining a magic number. None of it can be a unit test inside the island: what is under test is laid-out boxes at a specific viewport, and the defect being guarded against (a quarter of the window spent on navigation) is invisible at any width a headless default would pick. The same spec holds the two halves of one guarantee about the disclosed list's branch filter and quiet-rows fold: switching project clears both (a setState during the render that brings the new project in, in WorkspaceNav, keyed on selectedRepoId), and pressing Shift-Cmd-B clears neither (both live above the rail/column branch, so a collapse hides them rather than destroying them). Neither half can be a unit test: there is no DOM in the unit suite, the reset is only observable across a real mount of a second project, and the collapse is a subtree swap. It also holds the two refusals that only exist in a browser -- that clicking the project row you are already standing in does not move your open worktree, and that a rail carries a mark for a refusal raised while it is the only thing on screen, including one from the palette's prune door, whose only panel is inside the subtree the collapse unmounts. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
    owner: "vingilot/runs"
    removable_when: "Never, while the workspace has one navigation column whose width is a promise."
    status: "permanent"
    added: "2026-08-11"

  - path: "desktop/tests/e2e/workspace-palette.spec.ts"
    reason: "Task 1's proof (vingilot/docs/plans/2026-08-08-palette-and-documents.md) that Cmd-K reaches the island's palette rather than upstream's Search everything dialog. Upstream binds Cmd-K as a bubble-phase window listener in app/AppShell.tsx and opens features/search/ui/TopbarSearch.tsx; the island claims it with a capture-phase listener scoped to /workspace, and the whole claim rests on two facts no unit test can see -- that a window-capture listener runs before a window-bubble one, and that stopping there keeps the event out of the rest of the app. Every Cmd-K in this spec therefore also asserts that upstream's dialog stayed shut, and one test asserts it still opens on every other screen. Proved able to fail: with the capture flag removed, six of the twelve tests go red on upstream's dialog opening alongside the palette. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points, and the assertion is about two features of the whole app shell competing for one chord. Task 3 of vingilot/docs/plans/2026-08-09-keys-and-type.md adds four more tests to the same spec, about what a row looks like once it is drawn: that a row's kind is a mark and rows of one kind carry one mark, that a chord is keys in kbd boxes beside the row rather than glyphs buried in its sentence, that a blocked row keeps its name, states why, and drops the chord because the chord is blocked too, and that the arrow cursor, the mouse hover and a row nobody has been near are three different paints. All four are facts about resolved style and rendered DOM -- an assertion on a Tailwind class would only say which paint was written, not which one the browser arrived at, and the three-paints test in particular reads computed colours after the transition settles. Proved able to fail: collapsing the cursor's paint to the hover's takes the paint count from three to two."
    owner: "vingilot/runs"
    removable_when: "Never, while the palette holds a key upstream also binds."
    status: "permanent"
    added: "2026-08-08"

  - path: "desktop/tests/e2e/workspace-ask.spec.ts"
    reason: "Task 2's proof (vingilot/docs/plans/2026-08-08-palette-and-documents.md) that ask mode states what a question is asked with before it is asked, refuses when no ACP agent is configured, and lands the question and its answer somewhere the owner can come back to. Three things no unit test can establish: that the scope on screen is the same path that crosses the Tauri boundary into agent_run (the stub records the arguments and the test compares them), that the ask switches the right pane to where the answer arrives, and that the conversation is still there after a reload. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
    owner: "vingilot/runs"
    removable_when: "Never, while the palette can ask a local agent about a project."
    status: "permanent"
    added: "2026-08-08"

  - path: "desktop/tests/e2e/workspace-notes.spec.ts"
    reason: "Task 3's proof (vingilot/docs/plans/2026-08-08-palette-and-documents.md) that a project keeps its notes. One thing here cannot be established anywhere else: the plan names a debounce that drops the last keystroke on unmount as the failure most likely to be got wrong quietly, and a unit test can only prove the autosave machine writes when it is told to stop -- whether the component tells it, when the owner hides the right pane mid-sentence with Alt-Cmd-B, is a question about a real React unmount in a real browser. The spec also covers the two claims that only storage plus a reload can answer: a note is still there after a restart, and two projects are two documents. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
    owner: "vingilot/runs"
    removable_when: "Never, while a pane autosaves the owner's own writing."
    status: "permanent"
    added: "2026-08-08"

  - path: "desktop/tests/e2e/workspace-plan.spec.ts"
