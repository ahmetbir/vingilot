/plans/2026-08-09-keys-and-type.md, Task 1); and projects_load/projects_save (vingilot/docs/plans/2026-08-10-coordinator-optional.md, Task 1), which read and write the local project list at ~/.vingilot/projects.json -- the change that lets a machine with no coordinator hold a project at all, since until then the list existed only inside the coordinator's workspace document. That plan also rewrites the one existing block in this file that ⌘W runs through: the macOS RunEvent::WindowEvent CloseRequested arm, which used to hide the main window and is the reason the owner lost his window to ⌘W with no way back he could find. It now asks vingilot_window::resolve_close_request what the request means and either forwards it to the webview or minimizes -- and never hides. The arm has to be here because RunEvent is delivered to the single app.run closure, which upstream owns; the decision it takes is fork-owned and pure, in vingilot_window."
