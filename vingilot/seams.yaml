  - path: "desktop/tests/e2e/workspace-find.spec.ts"
    reason: "The proof that cmd F searches the pane he is looking at (vingilot/docs/plans/2026-08-12-vscode-muscle-memory.md, Task 1) -- and, in the same file, that it still reaches upstream's find-in-this-channel everywhere else. The pure halves are proved without a browser and deliberately kept there: desktop/src/features/runs/lib/findInFile.test.mjs owns smart case (including the Turkish capitals a Latin-A-to-Z test does not see, and the case-folding rule that keeps every offset intact where toLowerCase would shift them), the count, the wrap-around and the segment arithmetic that puts the amber on the right characters of a line; findKeys.test.mjs owns what each key means and which chords the two maps refuse. Four readings that only a browser can give. (1) The chord ARRIVES and arrives at the field -- a claimant check is a reading of source and cmd W was lost for want of a press, so cmd F is pressed over an open file and the input is asserted focused, with the count empty until a query exists. Then Enter and shift-Enter walk, and the wrap is read at BOTH ends (back off the front to 5/5, forward off the end to 1/5), because a walk that stopped dead is a bar that stopped answering; Esc closes and focus is asserted back on the viewer's own scrolling body, which is what keeps the pane from going keyboard-dead. (2) The amber is on the TEXT and not on the spans, read on the tokenised body with data-highlighted=\"true\" established FIRST so it is genuinely Shiki's tree being searched: all five matches marked, exactly one of them the current one, all five inside files-viewer-code, and the current one moving to the second occurrence read as the text of its own line rather than as \"a mark moved\". Smart case is read here as a number changing on screen (1/5 -> 1/1 on one capital) rather than as a colour that may or may not be there. (3) The same on the viewer's OTHER render path -- a 400-line file with no grammar the viewer knows, where ViewerLines draws its own line spans -- because a find proved only on the highlighted path works for TypeScript and silently not for a log. And the walk MOVES THE FILE: the far match is asserted not-in-viewport before Enter and the current one in-viewport after, since toHaveText does not require an element to be in view -- the exact hole that once left every Files spec green while the marked line sat hundreds of lines below the fold. (4) cmd F in the TEAM PANE still opens upstream's channel-find-bar, and this island's bar is not on screen. That is the reading the whole boundary rests on: useChannelFind binds cmd F as a bubble-phase window listener, TeamThreadPane hosts ChannelRouteScreen itself, and this island's listener is capture-phase with a stopPropagation -- so a boundary drawn one element too wide would take find-in-this-channel away from the pane the owner talks to his agents in, with nothing failing. Read in the workspace rather than on /channels/general because that is the screen where both handlers are live at once; workspace-search.spec.ts already covers the channel route for the shifted chord. Runs at 1728x1117, the 16-inch MacBook Pro's own resolution, the same width the Files, Search and History specs read their panes at -- the width at which the pane is ~435px and the find bar floats over the top-right of it. worktree_tree and file_read are stubbed through the same addInitScript property trap workspace-one-column.spec.ts documents, and everything else falls through to the mock bridge, which is what lets one harness serve both the Files pane and a real hosted channel; real git is driven instead by vingilot_files' own cargo tests against a temp repository. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
