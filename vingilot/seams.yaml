    reason: "The proof that the loading animation works in the BUILT BUNDLE rather than on paper, which the plan required because the mechanism could not be chosen from documentation. Four readings, none reachable from a unit test because all four are claims about what a browser did with the shipped asset: that the loop moves and moves in steps (the animation is paused, driven to exact times, and the rendered frames and transforms compared -- a mask that would not animate, a timing function that failed to parse, or a frame count disagreeing with the sheet all render a mark that merely sits there, with nothing failing anywhere); that the mark takes the THEME's ink, read as painted pixels on both themes; that a sheet which never arrives leaves the still poster and not an empty box, and not the solid rectangle an unresolved mask paints; and that reduced motion holds it still. Two findings are recorded in the file because they are traps rather than trivia: the theme claim must be read at the image's luminance extremes, since every patch of an antialiased mark is a blend that lands near mid-grey on BOTH themes (measured 156 against 148, which is why the first form of this test failed for the wrong reason); and test.use({ reducedMotion: 'reduce' }) does not reach the page in this config under Playwright 1.60, so the spec calls page.emulateMedia explicitly and asserts the media query matches before asserting anything about the mark. Proved able to fail: four product breaks, each rebuilt and re-run -- animation-name removed, the ink pinned to white instead of currentColor, the poster fallback removed, the reduced-motion block deleted -- each turning exactly the intended test red. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
