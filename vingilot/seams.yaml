    reason: "The proof that the terminal scrolls, and before the fix the reproduction that it did not. A previous change turned tmux's mouse on and shipped without live proof, because the E2E bridge stubs invoke and a spec over it says nothing about a PTY. This spec closes that gap from the other side: it replays the bytes tmux really sent on attach (tmux-attach-mouse-on.json) into the real Terminal component inside the real app shell, sends a real trusted wheel event, and asserts an SGR wheel report anchored at the pointer crossed pty_write -- with the IPC transport replaced by a recorder rather than by a fiction. Its second test is the A/B that keeps the fix honest: the terminal's claim on the gesture (shared/lib/wheelOwner.ts) is taken off the container at runtime and the pty goes silent, put back and the report returns. Its third holds the line the boundary lock exists for -- over the terminal the wheel still cannot rubber-band the webview. Nothing about this is reachable from a unit test: what is under test is which window-level listener wins a real wheel event. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
