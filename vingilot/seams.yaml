  - path: "desktop/src/shared/hooks/useWebviewScrollBoundaryLock.ts"
    reason: "The one upstream file that could hold the terminal's wheel fix, because it is the one that was eating it. This hook consumes every wheel gesture at WINDOW CAPTURE -- above the whole tree -- whenever nothing on the composed path is a CSS-scrollable container that can still move, which is right for Buzz's fixed-height panes and wrong for a terminal: under tmux the scrollback is tmux's, .xterm-viewport is a sibling of the path rather than on it, so the lock found nothing, called preventDefault plus stopPropagation, and the wheel never reached xterm to be reported to the pty (proved in desktop/tests/e2e/terminal-wheel.spec.ts). The island cannot fix this from inside itself: a listener registered later on the same target cannot un-stop a gesture stopped above it. Smallest possible touch -- one early return, six lines, ahead of the existing scrollable walk: over an element that claims the gesture (shared/lib/wheelOwner.ts) the default action is still cancelled, so the rubber-band this hook exists to stop is stopped exactly as before, and only the confiscation goes away. Every existing behaviour is unchanged for every path with no claim on it, which desktop/tests/e2e/overscroll-boundary.spec.ts continues to hold."
    owner: "vingilot/runs"
    removable_when: "Upstream grows its own way for an element to say a wheel over it is an input rather than a scroll, and the terminal can use that instead."
