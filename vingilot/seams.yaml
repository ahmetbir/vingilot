  # owner's work Mac, Kimi Code and Hermes Agent could not: their shell tools run
  # commands through a sanitising layer, so every reply died with auth_error,
  # exit 3, and the agent had no way to recover. Upstream already solved this for
  # Codex by giving it a buzz-dev-mcp MCP server with the credentials injected
  # into that server's own env, but only tier-1 runtimes were ever classified.
  #
  # These entries are NOT covered by the desktop/src-tauri/src/* sweep entry
  # above: that one authorizes product-name and mark changes only.
  # ---------------------------------------------------------------------------

  - path: "desktop/src-tauri/src/managed_agents/discovery/runtime_metadata.rs"
    reason: "Home of the fix. Adds effective_mcp_command, which turns 'this command is not in KNOWN_ACP_RUNTIMES' into buzz-dev-mcp rather than into nothing, and resolve_mcp_command, which resolves that binary and names the agent in the log when it is missing. Belongs here because KnownAcpRuntime::mcp_command -- the field the answer comes from -- is declared in this file, and its doc comment claimed the field was vestigial while it was in fact the only thing letting a sandboxed-shell harness reach the relay at all; the comment is corrected in the same change. The pure classifier also makes the decision testable without a spawn."
    owner: "vingilot/agents"
    removable_when: "Upstream classifies tier-2 presets and custom harnesses itself, or the harness stops depending on the agent's shell to carry credentials."
    status: "temporary"
    added: "2026-08-10"

