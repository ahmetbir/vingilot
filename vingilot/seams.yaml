  - path: "desktop/tests/e2e/workspace-files.spec.ts"
    reason: "The proof that the Files pane -- a tree of the selected worktree and a viewer -- reaches the screen (vingilot/docs/plans/2026-08-11-what-sent-him-to-vscode.md, Task 3; design in vingilot/docs/plans/2026-08-12-files-pane-design.md). The pure halves are proved without a browser and deliberately kept there: desktop/src/features/runs/lib/filesModel.test.mjs owns the rows a pair of records produces, the five tree keys, and the exact words of every refusal; fileViewer.test.mjs owns which files are highlighted and what is said about the ones that are not; filesTarget.test.mjs owns the outside route's store. Five readings that only a browser can give. (1) The pane is reachable the way every other pane is -- a Cmd-K row AND the pane picker -- which is a claim about the registry and is exactly what a new pane gets wrong by being added to the component tree without being added to PANE_IDS. (2) The tree walks under the arrow keys and opens under Enter, which is the half a pure key-map test cannot reach: a map bound to nothing passes every unit test there is; the lazy listing is visible in the same test, because src/greet.ts does not exist in the DOM until Right expands src. (3) An opened file is really highlighted -- asserted as per-token inline colours, more than one distinct colour, which is the one thing only Shiki produces; SyntaxHighlightedCode loads its grammar and theme asynchronously and falls back to plain spans on any failure SILENTLY, so 'the component rendered' is not evidence of anything. (4) Each refusal is its own sentence, on screen: too large carrying the real size (1.0 MiB) and the cap (512 KiB), binary saying 'looks binary' and differing from the first, and the plain-text notice on a 400-line file carrying both 400 and 150. That is Task 3's last checkbox, and a sentence that is correct in a model and never rendered is a failure this island has already had. (5) The viewer's route in from OUTSIDE the pane, driven through its first real caller -- the Diff pane's 'show the whole file' button raising onPaneAct({type:'show-file'}) -- asserting both halves of the wiring: the target is filed AND the pane is brought forward. Driven through a real button rather than a fabricated event on purpose: a spec dispatching its own channel would prove the pane can be told and nothing about whether anything tells it. Runs at 1728x1117, the 16-inch MacBook Pro's own resolution, and the viewport is load-bearing: it leaves the right pane ~435px, under PATCH_MIN_PX + LIST_MIN_PX, so diffListPlacement resolves to 'over' and the tree is a drawer -- the layout he will actually get, where a wider viewport would have tested one nobody has. The two commands are stubbed through the same addInitScript property trap workspace-one-column.spec.ts documents (the bridge assigns invoke during boot and the home-dir lookup runs on the first render, so an override installed after boot is too late); real git is driven instead by vingilot_files' own cargo tests against a temp repository, so nothing here is a property of whatever happened to be in a temp directory. Proved able to fail: the binary refusal replaced by a generic 'could not show this file.' turned reading (4) red on the exact assertion, and dropping panes.choose('files') from RunsScreen's show-file handler turned reading (5) red on the pane never appearing. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
