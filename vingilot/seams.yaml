    reason: "A seventh fork-owned island inside the Rust side (vingilot/docs/plans/2026-08-11-what-sent-him-to-vscode.md, Task 3; design in vingilot/docs/plans/2026-08-12-files-pane-design.md): reading a worktree's files so that a file he cannot open stops being a file he leaves to find elsewhere. Two commands and both of them read -- there is no create, rename, removal or temp file anywhere in it. tree.rs lists ONE directory level, never a walk: expanding a node is another call, because a recursive walk of his monorepo is a freeze in the pane he opened in order not to leave. It asks git what belongs to the checkout (ls-files --cached --others --exclude-standard, scoped by a :(literal) pathspec so a directory called [draft] is a name and not a glob) rather than implementing ignore-matching, because .gitignore is a system -- per-directory files, .git/info/exclude, core.excludesFile, the global excludesfile, precedence and negation -- and a matcher written here would be a second opinion about the owner's repository; it is also the same question vingilot_worktree/diff.rs already asks and the same one Task 2's git grep will answer from, so the three surfaces agree. read.rs reads one file with three bounds, each its own error variant and its own sentence: 512 KiB (checked against metadata BEFORE the open, so a 4 GB file costs one stat -- the lesson diff.rs paid for with an agent's 191 MB run.log -- and again at take(CAP+1), because a file can grow between the stat and the open while an agent writes into the worktree), a NUL in the first 8 KiB (git diff's own window, so the two panes cannot disagree about the same file), and the OS error otherwise. mod.rs holds the path guard both commands go through, which refuses `..` and absolute paths by inspection and a symlink out of the checkout by canonicalising and comparing -- the case the first two cannot see, and the one that matters because Task 2 will hand this module paths that came out of git grep. Kept apart from vingilot