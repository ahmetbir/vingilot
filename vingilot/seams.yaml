  - path: "crates/buzz-acp/src/broker.rs"
    reason: "New, fork-owned: the send broker. It lives in buzz-acp because that is the process that already holds the agent's key and is already authenticated to the relay -- the whole point is that the key never leaves it, so the endpoint cannot live anywhere else. What it covers: a unix socket (mode 0600, in a per-harness directory created mode 0700) serving exactly one op, send_message, which builds a kind-9 channel message via buzz_sdk::build_message, signs it with the harness keys, and submits it through the existing RestClient -- the same sequence as pool::post_failure_notice, not a second implementation of signing. What it does NOT cover: it hands out no key material, signs no caller-supplied bytes or events, and proxies no relay reads; those three are refused by name so a caller is told the boundary is permanent rather than a missing feature. Its only relay read is fetching a reply target's thread root, which the caller cannot aim (no filter in, no result out). No key is logged, formatted, or returned on any path, and a test asserts that over every op the module recognises."
