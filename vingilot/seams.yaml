  - path: "desktop/src-tauri/src/vingilot_search/**"
    reason: "An eighth fork-owned island inside the Rust side (vingilot/docs/plans/2026-08-11-what-sent-him-to-vscode.md, Task 2) -- the task the owner opened VS Code for: cmd shift f. One command, and it reads: git grep over the SELECTED WORKTREE'S CHECKOUT rather than an index this app maintains, because git already knows the tree, already respects the ignore rules the Files pane and the Diff pane answer from, and cannot go stale between an agent writing a file and him searching for it; an index would be a second opinion about his repository plus a cache to invalidate. grep.rs is the pure half -- the argument vector (built so a test can read it: --no-color so a color.ui=always config cannot put ANSI escapes in a result row, -I so a binary file is never a result the viewer would then refuse, --untracked --exclude-standard so this surface and the tree agree about what is in the checkout, -F literal by default with -E behind the toggle and never both, and -e BEFORE the pattern so a search for --force is a search and not a flag) plus the parser for -z's NUL-separated records, the 2,000-hit cap and the 400-character window that keeps a minified bundle's three-megabyte line from reaching the DOM. mod.rs is the runner, and it is the reason this is NOT inside vingilot_files: that module's header promises one directory per call and never a walk, and its run() is Command::output() -- blocking, unbounded, with no handle left to kill anything with. A git grep for e over this repository prints 87 MB (measured) and a pathological -E pattern can run for minutes, so this needs a child bounded in bytes (4 MiB, after which the reader drops the pipe and git exits on EPIPE, the same thing | head does) and in time (10 s, after which the child is KILLED and reaped and the refusal says so), which is machinery the tree listing and the file read would then be paying for on every keystroke. It borrows exactly one thing from its neighbours, vingilot_worktree's cached git() probe, so a search and a tree listing of the same worktree cannot disagree about which git answered. Never a shell string anywhere: the pattern is the owner's own typing and it is one element of an argument vector, which a cargo test asserts end to end by searching a real repository for $(id); rm -rf / and finding the text. git's exit codes are read as three answers and not two -- 0 is here they are, 1 is there are none, anything else is a refusal passed back in git's own words -- because reading 1 as a failure would turn every unsuccessful search into an error message, and reading it as an empty list without saying so is the other half of the same mistake. Additive-only new directory under the upstream desktop/src-tauri/src tree; no existing file is renamed or deleted, so it cannot merge-conflict."
