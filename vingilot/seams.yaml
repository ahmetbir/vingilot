  - path: "desktop/src-tauri/src/managed_agents/runtime.rs"
    reason: "The two sites that ask what MCP server an agent gets. spawn_agent_child (which writes BUZZ_ACP_MCP_COMMAND into the harness env) now calls resolve_mcp_command, and build_managed_agent_summary (which is what the UI's mcpCommand field actually reads -- the persisted record field is dead at spawn) calls effective_mcp_command. Both were inline `known_acp_runtime(..).and_then(|r| r.mcp_command).unwrap_or(\"\")`, which is exactly the expression that answered 'none' for every unclassified harness. The private key is untouched: it continues to reach the MCP server only through buzz-acp's build_mcp_servers, never through a command line, a file, or a log. Net shorter than before, which the file's 1000-line ratchet required."
