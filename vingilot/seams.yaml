  - path: "crates/buzz-cli/src/broker.rs"
    reason: "New, fork-owned: the CLI end of the harness send broker. It lives in buzz-cli because this is the process an agent shells out to, and the process that until now simply failed when its shell had no BUZZ_PRIVATE_KEY. What it covers: resolving identity in one order -- explicit --private-key, then BUZZ_PRIVATE_KEY (clap collapses those two), then the broker socket named by --broker-socket or BUZZ_BROKER_SOCKET (clap collapses those two as well) -- and, when only the broker is left, serving `messages send` by asking the harness over that socket. A blank value is treated as an absent one on both sides, because the shells this exists for blank variables as readily as they unset them and clap passes a blank env value through as Some(\"\"). What it does NOT cover: any other subcommand (each still fails as it did, CliError::Auth, exit 3), --file, and any kind but 9 -- refused by name so a message is never half-sent; and it does not scan for a socket, because choosing wrong among candidates means publishing the reply as another agent. Nothing here ever holds, reads, or asks for key material. The socket has a flag and the key does not, and that asymmetry is the point: a path on a command line is worth nothing to whoever reads `ps`, a key is the identity itself, and no failure this module produces names --private-key."
    owner: "vingilot/agents"
    removable_when: "Upstream adopts a credential broker of its own, or every harness this fork supports stops sanitising the environment it gives its shell tool."
