    reason: "The proof that the workspace palette is the top layer over a hosted channel surface (vingilot/docs/plans/2026-08-11-what-sent-him-to-vscode.md, Task 1) -- the owner's report that with the team thread open 'cmd k yaparsam bazi seyler cmd k'nin onune geliyor, textler'. What painted over it, measured at 1728x1117: the palette is absolute inset-0 z-30 inside RunsScreen's work-surface box, and every element between that box and the hosted ChannelRouteScreen (work-surface, pane-right, pane-team, team-thread-inset, team-thread, channel-drop-zone) had z-index auto with no transform and no isolation, so none of them created a stacking context -- which made ChannelPane's top chrome (absolute inset-x-0 z-40, the context holding chat-header) and its channel-composer-overlay (absolute inset-x-0 bottom-0 z-40) entries in the SAME stacking context as the palette, ranked against it directly. No unit test can see this: a stacking context is a property of computed style across a whole ancestor chain, and the offending numbers are in upstream components a fork test never renders. The reading is deliberately not 'the header is behind the scrim' but a sweep -- elementsFromPoint on a 12px grid across the entire right pane, asserting that nothing anywhere is in front of the palette overlay -- because the fix (PaneFrame is a stacking context) is a claim about every surface a pane will ever host and not about this one. It also asserts the two z-40 layers are really there, so a channel surface that stopped drawing them would say so rather than let the sweep pass by vacancy, and that the scrim answers a click over the thread's header. Proved able to fail: the spec was written and run against the unfixed build first, and answered with twenty-one elements in front of the palette, chat-header and message-composer among them. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
