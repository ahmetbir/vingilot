    reason: "One line: re-exports effective_mcp_command and resolve_mcp_command from the runtime_metadata submodule, beside the existing KnownAcpRuntime re-export. managed_agents/mod.rs does `pub use discovery::*`, so this is the only place the new functions can become reachable from runtime.rs and spawn_hash.rs."
    owner: "vingilot/agents"
