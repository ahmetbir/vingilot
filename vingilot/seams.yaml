    reason: "The proof that the Diff pane keeps up with the worktree instead of freezing at the moment it was opened -- the owner's report that it 'sadece açıldığı andaki halini gösteriyor'. Five readings, none of them reachable from a unit test because all five are about a live React tree on a real clock: a change made AFTER the pane opened arriving with nothing clicked; the open file staying open by path while a new file sorts above it and every index shifts; a read slower than the cadence never being started on top of itself, proved from the stub's own start/finish timestamps rather than from a count; a hidden window spending no git at all across a wait the cadence was already past due for; and a window coming back reading at once, inside a gap deliberately made long enough that the cadence cannot account for it. worktree_diff is stubbed rather than run -- what is under test is WHEN the pane asks and what it does with the answer, and a real git would make every timing a property of the machine. The arithmetic behind those timings is proved separately and purely in desktop/src/features/runs/lib/diffRefresh.test.mjs. Proved able to fail: four product breaks (the cadence pump removed, the place-keeping replaced by a reset, the visibility gate defeated, the in-flight guard defeated), each turning exactly the intended test red and nothing else. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
