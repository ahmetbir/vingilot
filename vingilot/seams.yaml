  - path: "desktop/tests/e2e/workspace-search.spec.ts"
    reason: "The proof that cmd shift f reaches him (vingilot/docs/plans/2026-08-11-what-sent-him-to-vscode.md, Task 2) -- the gesture he left the workspace for. The pure halves are proved without a browser and deliberately kept there: desktop/src/features/runs/lib/searchModel.test.mjs owns the grouping, the emphasis, the exact words of all five refusals and the rule that no matches is only reachable from an answer; searchKeys.test.mjs owns what the chord means. Six readings that only a browser can give. (1) The chord ARRIVES -- a claimant check is a reading of source and cmd W was lost for want of a press, so shift-cmd-F is pressed over an open project with a real terminal mounted and the field is asserted focused; the other half of that claim is asserted on the screen it belongs to, that plain cmd F still opens upstream's channel find bar on /channels/general, because we took the shifted one is a claim about two window handlers and only a document can say which got the key. (2) The pane is on the registry -- a cmd K row AND the picker -- which is what a new pane gets wrong by being added to the component tree without being added to PANE_IDS, and the row prints the chord, which is what makes the palette a place he LEARNS the shortcut rather than a second forever-way of doing it. (3) Results arrive grouped by file with the line, the line's own text, and the match emphasised where git said it is. (4) Enter lands in the FILES VIEWER at the line, driven through the real Enter and the real onPaneAct show-file route (files-pane design section 6) rather than a fabricated event -- a spec dispatching its own channel proves the Files pane can be told and nothing about whether the search tells it -- and asserted by the marked line's own TEXT, since an off-by-one in either direction is still a number. It walks to the SECOND file's hit on purpose: a landing that opened whatever came first would pass either way. (5) A capped answer says so, over the results it did return, counting what he got rather than repeating the limit so the sentence and the list cannot contradict each other. (6) git's refusal is on screen in git's own bytes (the real fatal: -e option, '[': brackets ([ ]) not balanced), because a build that paraphrased it into invalid pattern would look identical from every unit test that only asked whether something was said -- and a search that git REFUSED shows neither no matches nor a result list. Runs at 1728x1117, the 16-inch MacBook Pro's own resolution, the same width the Files spec reads its pane at. worktree_search and file_read are stubbed through the same addInitScript property trap workspace-one-column.spec.ts documents (the bridge assigns invoke during boot and the home-dir lookup runs on the first render, so an override installed after boot is too late); real git is driven instead by vingilot_search's own cargo tests against a temp repository, so nothing here is a property of whatever happened to be in a temp directory. Proved able to fail: three product breaks -- the hit's line replaced by null in the pane's show-file act (reading 4 red on the marked line), the git-failed sentence replaced by a paraphrase (reading 6 red on the verbatim bytes), and the capped paragraph never rendered (reading 5 red) -- each turning exactly the intended test red and nothing else. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
