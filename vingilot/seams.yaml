  - path: "desktop/tests/e2e/workspace-history.spec.ts"
    reason: "The proof that what git already knows reaches the screen (vingilot/docs/plans/2026-08-11-what-sent-him-to-vscode.md, Task 4) -- commit history, the diff of a commit, and source control as a surface. The pure halves are proved without a browser and deliberately kept there: desktop/src/features/runs/lib/historyModel.test.mjs owns how a malformed wire record is read, which sections git's four columns become, how the cursor walks the rows, how a page appends without duplicating a commit, how a date is printed without a locale, and the rule that no commits yet and the working tree is clean are only ever reachable from an answer. Six readings that only a browser can give. (1) The pane is on the registry -- a cmd K row AND the picker -- which is exactly what a new pane gets wrong by being added to the component tree without being added to PANE_IDS. (2) The commit list renders with the four fields the plan named (short hash, subject, author, date) plus refs as their own marks, and the date is asserted as the AUTHOR's clock (02:18 at +03:00), which a Date would have re-zoned into the reader's. (3) Selecting a commit shows its patch IN THE SHARED RENDERER, and that is asserted as PatchView's own data-wrapped attribute plus more than one resolved line colour from the diffView both panes share -- not as a patch appeared, which passes against a copy; a forked renderer would have to reproduce both to pass, at which point it is the same component with extra steps. That is Task 4's do-not-fork rule turned into an assertion. (4) The status lists render, and clicking a file shows its diff -- sourced from worktree_diff, the Diff pane's own read, landing in the same box a commit's patch does, with the pane stating out loud that the patch is against HEAD and therefore staged and unstaged together. (5) NOTHING IN THE PANE OFFERS A MUTATING ACTION: every control is collected out of the real DOM in BOTH of the pane's layouts (the narrow layout swaps the list out for the patch, so a control living only there would never be read otherwise) and its accessible name is matched against the verbs that write, with no checkbox anywhere -- a scan rather than a list of expected buttons, because a test asserting exactly two buttons goes red when someone adds a third read and green when they rename one into Discard. This is where the plan's line at reading is kept. (6) j/k walk the rows and Enter opens -- the half a pure key-map test cannot reach, since a map bound to nothing passes every unit test there is; it walks out of the status rows into the commits, which is the point of one list rather than one cursor per section. Runs at 1728x1117, the 16-inch MacBook Pro's own resolution, the same width the Files and Search specs read their panes at, and the viewport is load-bearing: it leaves the pane ~435px, under LIST_LEAVES_BELOW_PX, so historyLayout resolves to one-half-at-a-time -- the layout he will actually get, where a wider viewport would have tested one nobody has. The four commands are stubbed through the same addInitScript property trap workspace-one-column.spec.ts documents (the bridge assigns invoke during boot and the home-dir lookup runs on the first render, so an override installed after boot is too late); real git is driven instead by log.rs, status.rs and commit_patch.rs' own cargo tests against temp repositories, so nothing here is a property of whatever happened to be in a temp directory. Extended 2026-08-12 for Task 2 of vingilot/docs/plans/2026-08-12-vscode-muscle-memory.md with one reading, and it is a reading about the do-not-fork rule rather than about split: that the SAME toggle and the SAME width precondition arrived on this surface without being written a second time. Read at both of this spec's viewports, because the control's behaviour is a function of one -- disabled with its sentence at the 16-inch's ~435px pane, enabled on the external display, and the commit's per-file patch box carrying data-mode=split after one click. The fixture's block is one deletion against TWO additions, so the gap falls on the LEFT here where the Diff pane's fixture puts it on the right: the mirror image, which is what says the alignment is the shared model's and not a property of one patch. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the other fork specs do: that is where playwright.config.ts's testDir points."
    owner: "vingilot/runs"
    removable_when: "Never, while the workspace shows a commit history and a source-control state without leaving it."
    status: "permanent"
    added: "2026-08-12"

  - path: "desktop/tests/e2e/workspace-history.fixtures.ts"
    reason: "The world workspace-history.spec.ts runs in, split from the readings taken of it -- the same split, for the same two reasons, that workspace-readme-shots.fixtures.ts records. The first is the file ratchet: the spec had reached 1048 lines, and the rule in this repository is a split and never a raise (the automated guard, desktop/scripts/check-file-sizes.mjs, only walks src-tauri/src, src/app, src/features and src/shared/*, so desktop/tests/e2e/ is over the line without pnpm check saying so -- which is why the precedent matters more than the gate here). The second is that the two halves change for different reasons: this file moves when git's answers or the harness move, the spec moves when what is worth asserting changes; the line between them is what would have to be true for the pane to be on screen versus what is then true of it. Holds the invented repository and worktree, the three commits (one with refs, one plain, one merge), the four patch bodies including the cut one, the four-column status answer, the two viewports the pane is read at, the regex of every verb that would mean this pane writes, and the harness that installs all of it: the coordinator route table, the addInitScript property trap that stubs worktree_log, worktree_status, commit_diff and worktree_diff with their knobs, the palette route into the pane, and the DOM scan that collects every control the pane offers. Nothing here is real: no path, repository, host, key or person named in it exists, and the hashes are runs of one letter so a failure message says which commit it was about at a glance. One knob is worth naming: SLOW_COMMIT_MS makes a single commit_diff answer late, because every other stub resolves in the same tick and that is precisely why an out-of-order answer overwriting a newer one was invisible to a browser until now. Not registered in playwright.config.ts and not registrable by accident -- every testMatch entry there is a literal spec basename -- and it declares no test() of its own, so it is imported by the spec beside it and never collected. Lives at the upstream-owned desktop/tests/e2e/ path for the same reason the spec does: that is where playwright.config.ts's testDir points."
