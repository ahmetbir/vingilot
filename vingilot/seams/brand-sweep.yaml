# ==============================================================================
# Vingilot seam inventory — fragment: the product-name and mark sweep
# ==============================================================================
#
# A fragment of vingilot/seams.yaml, not a file with rules of its own. The
# format, the meaning of a pattern, and the reason any of this exists are all
# documented in the header of vingilot/seams.yaml — read that first; this file
# only holds entries.
#
# Why it is a separate file: the sweep's entries are enumerated one file each
# (they replaced three blanket globs that pre-authorised whole trees), and that
# enumeration pushed vingilot/seams.yaml past the repo's 1000-line-per-file
# ceiling. The house rule is "split, never raise", so it was split. Fragments
# are globbed by vingilot/scripts/lib/seam-glob.sh, so adding another one needs
# no change to any script.
#
# Scope of this fragment: every entry here authorises ONE class of change —
# renaming the product on the surfaces that name it, and swapping upstream's
# bee for the fork's mark. Three blocks, all of the same sweep: the frontend
# half, the native half, and the upstream Playwright specs that assert on the
# copy the sweep changed. Anything that is not product name or mark belongs in
# an entry of its own, in vingilot/seams.yaml.
#
# No schema_version here: the root file carries it for the whole registry.
# ------------------------------------------------------------------------------

seams:
  # ---------------------------------------------------------------------------
  # Product-name and mark sweep (ship-it, finishing pass), frontend half.
  #
  # The owner installed the renamed build and reported the rebrand as
  # unfinished -- the app was called Vingilot but every screen it drew still
  # said Buzz and drew upstream's bee. Renaming a product is not a feature
  # landing in one place; it is a property of every surface at once, and there
  # is no message catalogue or product-identity module in this codebase to
  # override, so the strings and the marks are where they are rendered.
  #
  # This block was previously a single blanket entry, desktop/src/*, which
  # under the old bash-case matcher pre-authorised every file in the tree
  # forever and left the gate unable to reject anything there. It is now the
  # list of files the sweep actually touched, one entry each.
  #
  # These entries authorize exactly one class of change and no other: prose
  # naming the application, window/dialog titles, alt text, aria-labels,
  # sr-only captions, notification and error bodies, onboarding copy, settings
  # copy, and swapping upstream's bee for the fork's mark. Explicitly NOT
  # covered, and no string of these kinds was touched anywhere in the list:
  # the keychain service buzz-desktop, the agent nest ~/.buzz, the dev bundle
  # identifier xyz.block.buzz.app.dev, the buzz CLI and its subcommands, the
  # buzz-acp / buzz-agent / buzz-dev-mcp binaries, BUZZ_* env vars, event-kind
  # and protocol vocabulary, relay hostnames and paths, the xyz.block.buzz
  # product on the relay side, package names, the buzz / buzz-dark theme ids
  # and their Shiki aliases, the Buzz Agent runtime's own label and vendor
  # mark, or test fixtures asserting upstream strings.
  # ---------------------------------------------------------------------------

