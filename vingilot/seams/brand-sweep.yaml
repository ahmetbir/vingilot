  - path: "desktop/src-tauri/src/managed_agents/runtime/instance_reaper.rs"
    reason: "Teaches the dead-instance reaper the name of the executable this bundle actually ships. productName in tauri.conf.json names the binary inside the bundle and this fork changed it, so the reaper found no live process for its own instance id, concluded every instance was dead, and killed the agents of a running app -- a failure that reads on screen as agents quitting by themselves. Upstream's names are kept alongside rather than replaced: the two apps share ~/.buzz and the same keychain service, so both write agent records into the same nest and a reaper that stopped recognising a live Buzz would reap that app's agents. The added test covers both directions, and lives in this file rather than beside the other reaper tests because tests.rs is already over the file-size ratchet."
    owner: "vingilot/brand"
    removable_when: "Upstream resolves the running executable's own name from its bundle metadata instead of matching a hardcoded list."
    status: "permanent"
    added: "2026-08-10"

