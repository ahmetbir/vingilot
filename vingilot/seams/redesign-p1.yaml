  - path: "desktop/src/features/sidebar/ui/AppSidebarPinnedHeader.tsx"
    reason: "The mockup's nav row order and signals: Inbox (existing count badge), Agents (+ fork AgentsWorkingDot), Pull requests (upstream's gated Repos row, relabeled to what the mockup's stage calls it, + open-count badge from the fork's useOpenPullRequestCount — view/route/testid keep their names), Deck; the gated Pulse/Workflows rows move below, still compiled (removal is P7's). The PR row is its own child component so the work-items query mounts only inside its FeatureGate."
    owner: "vingilot/redesign"
