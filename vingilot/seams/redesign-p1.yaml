    owner: "vingilot/redesign"
    removable_when: "While the 44px bar ships."
    status: "permanent"
    added: "2026-08-29"

  - path: "desktop/src/shared/ui/sidebar.tsx"
    reason: "Three constants: the resize clamp 220/420/300 → the mockup's 196/340/244 (min/max/default). The magnet/snap machinery is untouched — it magnetizes to SIDEBAR_WIDTH_DEFAULT, so it re-targets 244 by itself. Parameter tuning only; no new plumbing in this over-ratchet file."
    owner: "vingilot/redesign"
    removable_when: "While the mockup's sidebar geometry ships."
    status: "permanent"
    added: "2026-08-29"

  - path: "desktop/src/features/sidebar/ui/AppSidebar.tsx"
