# ==============================================================================
# Vingilot seam inventory — fragment: redesign P1 (shell)
# ==============================================================================
#
# A fragment of vingilot/seams.yaml, not a file with rules of its own. The
# format, the meaning of a pattern, and the reason any of this exists are all
# documented in the header of vingilot/seams.yaml — read that first; this file
# only holds entries.
#
# Scope of this fragment: phase P1 of the 2026-08-29 redesign
# (vingilot/docs/plans/2026-08-29-redesign.md) — the shell relayout. One class
# of change: the mockup's window anatomy (vingilot/design/mockup/) over the
# existing machinery — a 44px top bar (search pill, History, Copy-link,
# Appearance tray), the floating stage card on the gradient ground, the new
# sidebar row order with live signals, the 196–340 resize clamp, and the
# shell-owned ⌘B / ⌥⌘B / ⌘K chords. Explicitly NOT covered: the dock (P3),
# the deck/terminal internals (P2), status bars (P4), and any removal of the
# old chrome (P7 — the CommunityRail and light-theme paths stay compiled).

seams:
  - path: "desktop/src/app/AppTopChrome.tsx"
    reason: "The old top chrome (sidebar toggle + back/forward on a solid bg-sidebar strip) becomes the Vingilot top bar: same file, same mount, same data-tauri-drag-region and global-back/global-forward testids, restyled transparent over the gradient ground at 44px, plus three additions wired to fork modules — a centered 'Search everything ⌘K' pill and a History button that post through the fork's paletteRequest mailbox, a Copy-link button calling the fork's copyShellLink, and an Appearance button hosting the fork's VingilotAppearanceTray. Also mounts useShellChords (the fork's app-wide ⌘B/⌥⌘B owner) because this is the one component rendered inside SidebarProvider on every screen. macOS traffic-light clearance px re-derived for the 44px bar (translate-y 3px→1px)."
    owner: "vingilot/redesign"
    removable_when: "P7 may replace the file wholesale; the seam stands while the redesign ships."
    status: "permanent"
    added: "2026-08-29"

  - path: "desktop/src/app/AppShell.tsx"
    reason: "Four lines of wiring for the new top bar, plus (2026-09-03) one icon button beside Copy link that opens the feedback dialog through features/runs/lib/feedbackRequest.ts — a mailbox call, no state of its own. AppTopChrome now receives activeChannelId (the Copy-link target, null off channel views) and isWorkspaceView (so useShellChords refuses ⌥⌘B where WorkSurface's pane-solo owns it). No structural change — the shell's render tree, providers and routing are untouched."
    owner: "vingilot/redesign"
    removable_when: "With the AppTopChrome seam."
    status: "permanent"
    added: "2026-08-29"

  - path: "desktop/src/app/BuzzThemeSurfaces.tsx"
    reason: "ContentSurface — the existing floating-card primitive — is re-hosted as the mockup's stage card: margins re-tuned to the ~10px gutters (mb/ml/mr-2.5, mt-0 because the 44px top bar is the top gutter), radius rounded-2xl→rounded-xl (the mockup's 12px). Same element, same data-buzz-content-surface contract, same shadow; the unframed branch is untouched."
    owner: "vingilot/redesign"
    removable_when: "While the floating-card layout ships."
    status: "permanent"
    added: "2026-08-29"

  - path: "desktop/src/app/AppShellChannelSurface.tsx"
    reason: "One class: the channel surface wrapper drops bg-sidebar for bg-transparent so the window's gradient ground shows through the stage card's gutters. Huddle rooms keep their solid bg-background branch."
    owner: "vingilot/redesign"
    removable_when: "While the floating-card layout ships."
    status: "permanent"
    added: "2026-08-29"

  - path: "desktop/src/app/useShellChords.ts"
    reason: "New, fork-owned: the app-wide owner of ⌘B (toggle the one sidebar via SidebarProvider's own toggleSidebar) and ⌥⌘B (zen — refused while /workspace owns it as pane-solo, claimed-but-idle elsewhere until P3's dock exists). Carries the six-claimant chord audit in the terminalKeys.ts idiom; defers to TipTap Bold by honoring defaultPrevented. Lives beside AppShell because the chord's scope is the shell, not any feature island."
    owner: "vingilot/redesign"
    removable_when: "Never, while the redesign ships; P3 gives ⌥⌘B its dock meaning here."
    status: "permanent"
    added: "2026-08-29"

  - path: "desktop/src/app/copyShellLink.ts"
    reason: "New, fork-owned: the top bar's Copy-link action. Builds a buzz://message deep link through the channel's newest message (one bounded relay query + the message action bar's own buildMessageLink) because that is the only deep-link vocabulary the Rust handler answers today; a channel with no messages gets an honest toast, not an invented scheme."
    owner: "vingilot/redesign"
    removable_when: "When a first-class channel/worktree deep-link scheme exists (P3/P6)."
    status: "permanent"
    added: "2026-08-29"

  # RETIRED by the P7 sweep, 2026-09-01:
  # "desktop/src/app/VingilotAppearanceTray.tsx". This entry asked for exactly
  # this: its removable_when read "P7 sweep may retire the entry once the deletion
  # is upstream history." It is — better than that. The file was created in P1 and
  # deleted in P1.1 (owner veto 2), both inside this branch, so it exists neither
  # on upstream/main nor at the merge-base and appears in no diff check-seams.sh
  # reads. The three controls it held live in Settings; that is where they are
  # declared.

  - path: "desktop/src/shared/theme/vingilot-crew-position.ts"
    reason: "New, fork-owned: the persisted crew-panel position (right/drawer/float, localStorage key vingilot-crew-position in the module-key-per-concern idiom). Write-side only in P1; P3's dock is the reader."
    owner: "vingilot/redesign"
    removable_when: "With the dock decision."
    status: "permanent"
    added: "2026-08-29"

  - path: "desktop/src/shared/theme/vingilot-appearance.ts"
    reason: "P1 addition to the P0 file: VINGILOT_WASH_GRADIENTS, the mockup's wash gradient endpoints as data, for surfaces that must depict a wash without applying it — the tray's swatches. The live gradient stays stylesheet-owned."
    owner: "vingilot/redesign"
    removable_when: "With the P0 entry for this file."
    status: "permanent"
    added: "2026-08-29"

  - path: "desktop/src/shared/styles/globals/vingilot-tokens.css"
