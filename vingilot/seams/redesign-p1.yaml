  - path: "desktop/src/features/runs/lib/columnKeys.ts"
    reason: "Header comment only: records that the live ⌘B binding moved to the shell (useShellChords) and why the pure map stays — the scratch shields resolve against it and it documents what ⌘B refuses. No code change."
    owner: "vingilot/redesign"
    removable_when: "With the useShellChords seam."
    status: "permanent"
    added: "2026-08-29"

  - path: "desktop/src/features/runs/lib/useColumns.ts"
    reason: "The workspace-local ⌘B keydown listener is removed — the shell owns the chord now (useShellChords), and two listeners toggling one sidebar on one keydown would cancel each other. The hook keeps its per-project restore/record effects, which observe the same SidebarProvider state the shell chord moves."
    owner: "vingilot/redesign"
    removable_when: "With the useShellChords seam."
    status: "permanent"
    added: "2026-08-29"

  - path: "desktop/src/features/runs/lib/paletteRequest.ts"
