# ==============================================================================
# Vingilot seam inventory — fragment: composer dictation (Task 3, voice plan)
# ==============================================================================
#
# A fragment of vingilot/seams.yaml, not a file with rules of its own. The
# format, the meaning of a pattern, and the reason any of this exists are all
# documented in the header of vingilot/seams.yaml — read that first; this file
# only holds entries.
#
# Scope of this fragment: Task 3 of vingilot/docs/plans/2026-08-13-voice.md —
# mic-to-draft dictation in the message composer (DM/channel/team-thread) and
# the workspace's Ask box. Task 2 (TTS) was dropped by the owner before this
# landed (see that plan's Rescope note) and touches nothing here.
#
# TWO PATHS THIS TASK TOUCHES ARE ALREADY COVERED AND GET NO NEW ENTRY, the
# way iterm-chords.yaml handled already-declared paths: `desktop/playwright
# .config.ts` (vingilot/seams.yaml's own entry already covers registering a
# new spec in the `smoke` project's testMatch), and
# `desktop/src/features/runs/ui/CommandPalette.tsx` (vingilot/seams.yaml's
# blanket `desktop/src/features/runs/**` entry — "the Runs island... is a new
# fork-owned directory... additive only" — already covers the Ask-box mic
# button added there).
#
# The Rust half needed no lib.rs/app_state.rs growth: `dictation.rs` reuses
# `huddle::stt::SttPipeline` verbatim but owns its one running pipeline from a
# process-global `static Mutex`, mirroring `huddle::models`'
# `GLOBAL_MODEL_MANAGER` singleton, specifically so this feature costs
# `app_state.rs` zero lines rather than pushing it further over the file-size
# ratchet it (like `MessageComposer.tsx`, see that path's entry below) was
# already past. The three new commands register in
# `vingilot_command_table.rs` — the file `home-harbor.yaml` already split out
# of `lib.rs` for exactly this headroom reason.

seams:
  - path: "desktop/src-tauri/src/dictation.rs"
    reason: "New, fork-owned: the standalone dictation pipeline (vingilot/docs/plans/2026-08-13-voice.md, Task 3) — start_dictation/stop_dictation/push_dictation_audio_pcm, reusing huddle::stt::SttPipeline verbatim from a process-global static Mutex<DictationState> (mirrors huddle::models' GLOBAL_MODEL_MANAGER singleton) rather than an AppState field, so the desktop file-size ratchet's already-full app_state.rs gains no lines. Every finished utterance is forwarded as a `dictation-transcript` Tauri event — never a relay POST — because the huddle path's only text sink (huddle::pipeline::spawn_transcription_task) posts a kind:9 message every huddle member can read, and a dictation draft must never leave the machine, let alone leak into a channel. On-device only, stated in the module's own header per the plan's standing privacy constraint."
    owner: "vingilot/runs"
    removable_when: "Never, while the composer/Ask-box mic button ships. Replaceable only if a future refactor merges dictation into huddle's own STT slot without reintroducing the relay-leak risk this file was written to avoid."
    status: "permanent"
    added: "2026-08-14"

  - path: "desktop/src/features/dictation/**"
    reason: "New, fork-owned frontend island for Task 3: dictationFold.ts (pure append-only fold, no partial — the recognizer is non-streaming, so there is nothing to replace, only append), dictationKeys.ts (the ⌃⌘D chord resolver and its five-claimant audit), useDictation.ts (mic lifecycle, model-download offer, idle auto-stop timed from the last real transcript event rather than a raw-audio timer), useComposerDictation.ts (the composer-specific wiring, split out specifically to keep MessageComposer.tsx's own footprint minimal — see that path's entry below), and DictationButton.tsx (the shared mic button + listening/downloading/error status row used by both the composer and the Ask box). Additive only: a new directory inside the upstream desktop/src/features tree, mirroring how desktop/src/features/runs/** is already declared as an island for the same structural reason."
    owner: "vingilot/runs"
    removable_when: "Never, while composer/Ask-box dictation ships."
    status: "permanent"
    added: "2026-08-14"

  - path: "desktop/src-tauri/src/lib.rs"
    reason: "One line: `mod dictation;`. No command registration here — that lives in vingilot_command_table.rs (see its own entry, already declared by home-harbor.yaml), which is the whole reason that split exists: lib.rs has no headroom to spend on a new island's commands."
    owner: "vingilot/runs"
    removable_when: "Never, while dictation.rs exists as a module."
    status: "permanent"
