  - path: "desktop/tests/e2e/composer-dictation.spec.ts"
    reason: "The browser proof of dictation: a fake getUserMedia (same shape huddle-transcription.spec.ts's installFakeHuddleMicrophone uses) satisfies mic acquisition for real, and the pipeline itself is mocked — the mic button toggles real UI state, finished utterances (driven via __BUZZ_E2E_EMIT_TAURI_EVENT__) fold into the composer with correct spacing and no partial-replace case (there is none — dictationFold.test.mjs's header explains why), Esc stops, sending stops, and an absent model offers the download flow instead of failing silently. RED-proven on the send-stops case specifically, because that is the one that caught a real design bug: an earlier isSending-reactive auto-stop missed a fast/mocked send entirely (disabling MessageComposer.tsx's synchronous dictation.stop() reproduced the exact failure this spec now guards; restoring it fixed it; the spec file's sha256 was identical across both runs, evidence it wasn't rewritten to fit). Registered in playwright.config.ts's smoke project (already a declared seam)."
    owner: "vingilot/runs"
    removable_when: "Never, while the composer ships a mic button."
    status: "permanent"
    added: "2026-08-14"

  - path: "desktop/tests/e2e/dictation-transcript-scoping.spec.ts"
    reason: "A verifier finding's RED-proof: dictation.rs's one process-global pipeline broadcasts dictation-transcript to every listener, and every mounted useDictation instance registered one — CommandPalette.tsx calls useDictation before its `if (!open) return null`, so its listener is live for as long as RunsScreen has the palette mounted, regardless of open state. This spec starts dictation in a channel pane's dock composer (via the workspace's team-thread pane, the same hosted-composer-next-to-the-palette setup workspace-palette-over-thread.spec.ts already uses), opens the palette, emits one transcript, and asserts it folds only into the composer that called start() — the palette's idle instance must not also fold it. Removing useDictation.ts's `status !== \"listening\"` guard turns this red, proving it actually exercises the fix rather than passing by construction. Registered in playwright.config.ts's smoke project (already a declared seam)."
    owner: "vingilot/runs"
    removable_when: "Never, while more than one useDictation instance can be mounted at once."
    status: "permanent"
    added: "2026-08-14"
