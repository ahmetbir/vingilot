  - path: "desktop/src/features/messages/ui/MessageComposer.tsx"
    reason: "Already declared by drag-and-drop.yaml for an unrelated reason; this entry is the dictation-specific one. Wiring is the smallest this file could carry: one useComposerDictation(...) call, one dictation.stop() at the top of submitMessage (synchronous, not isSending-reactive — a Playwright RED-proof showed the reactive version misses a fast/mocked send within one React batch), one dependency-array entry, one dictation={dictation} prop into ComposerDockToolbar. Landing the dictation wiring pushed this file to 1028 lines against the desktop file-size ratchet's grandfathered 1014-line baseline (a verifier finding, not a silent violation) — the honest fix, splitting this file the way vingilot_command_table.rs split lib.rs at its own ratchet ceiling, is what actually landed: the submit path (edit-save branch, normal-send branch, the form's onSubmit) moved out to useComposerSubmit.ts (see that path's entry), landing this file at 919 lines, under the pre-dictation baseline."
