# ==============================================================================
# Vingilot seam inventory — fragment: upstream sync (block/buzz 0.5.11)
# ==============================================================================
#
# A fragment of vingilot/seams.yaml, not a file with rules of its own. The
# format, the meaning of a pattern, and the reason any of this exists are all
# documented in the header of vingilot/seams.yaml — read that first; this file
# only holds entries.
#
# Scope of this fragment: the workflow touches the 0.5.3 -> 0.5.11 merge forced.
# Upstream's 231-commit sync brought two new CI workflows that carry the exact
# failure vingilot/seams/home-harbor.yaml already deleted docker.yml for — a
# publisher for a ghcr.io/block/* image the fork cannot write, and an inherited
# smoke lane that runs on every push to a repo the fork does not have the infra
# for. docker.yml itself, and scripts/test-release-ref-contract.sh, are already
# declared in home-harbor.yaml; only the two new paths appear here.

seams:
  - path: ".github/workflows/sprig-image.yml"
    reason: "DELETED. New in upstream 0.5.11: the publisher for ghcr.io/block/buzz-sprig, the digest-pinned box the Kubernetes backend pulls. It triggers on push to main and pushes to the block GHCR namespace, which this fork's GITHUB_TOKEN cannot write — the identical denied: permission_denied failure that made the fork delete docker.yml, on an image the fork neither builds nor deploys (the Kubernetes backend is upstream-only). The IMAGE_NAME var indirection would still leave a push-to-main publisher for a release lane the fork does not have, so it is deleted rather than neutered, exactly as docker.yml was. This entry authorises the deletion — the seam gate checks deleted paths as well as added ones — and stays in the registry so a later upstream merge that reintroduces the file is a decision rather than a surprise."
    owner: "vingilot/ci"
    removable_when: "Upstream stops publishing the sprig image from this repository, or the fork gains write access to the block GHCR namespace and ships the Kubernetes backend."
    status: "permanent"
    added: "2026-08-13"

  - path: ".github/workflows/mesh-lifecycle.yml"
    reason: "New in upstream 0.5.11: the relay-driven mesh lifecycle smoke, which runs on every push to main and stands up block-only mesh infra. Guarded rather than deleted because it is trivially guardable — one job, gained one line, if github.repository == block/buzz — and keeping the file whole means a future upstream edit to it merges cleanly instead of re-adding a path the fork keeps having to delete. The guard names the exact repository, not the owner, for the reason vingilot-desktop.yml's guards give: a skipped job reports green with no work done, and a repository rename must not silently re-enable a lane that needs infra the fork does not have."
    owner: "vingilot/ci"
    removable_when: "Upstream gates the lifecycle smoke on its own repository, or the fork gains the mesh infra the smoke exercises."
    status: "permanent"
    added: "2026-08-13"

  - path: "desktop/src-tauri/src/managed_agents/spawn_snapshot.rs"
    reason: "The spawn_hash -> spawn_snapshot port. Upstream deleted managed_agents/spawn_hash.rs (the fork's seam for it is at vingilot/seams.yaml, the reply-path fix that routes the spawn hash through effective_mcp_command so an unclassified preset/custom harness resolves to buzz-dev-mcp rather than to nothing) and moved the same computation into this new file's SpawnConfig::from_inputs. The one-line intent moved with it: mcp_command is now effective_mcp_command(known_acp_runtime(&descriptor.command)) instead of the inline and_then(mcp_command).unwrap_or(\"\") upstream ships, so a running agent still shows the restart badge that reflects its real reply path. Same reason and same footing as the original spawn_hash.rs seam; it has to be at this path because the spawn snapshot is where upstream now derives the value."
    owner: "vingilot/agents"
    removable_when: "The MCP command stops being a spawn input the desktop derives, or upstream classifies tier-2 presets itself."
    status: "temporary"
    added: "2026-08-13"

  - path: "desktop/src-tauri/src/commands/agent_discovery/managed_node_tests.rs"
    reason: "One test assertion, forced by the brand sweep. Upstream 0.5.11 moved managed_node.rs's inline #[cfg(test)] module out to this new external file (#[path] mod tests). managed_node.rs's own product-name strings are a declared brand seam (vingilot/seams/brand-sweep.yaml) — the npm-EACCES hint reads 'Vingilot's private Node tools directory' — and this file's test_npm_eacces_hint_guidance assertion greps for that exact string, so leaving it as upstream's 'Buzz's private Node tools directory' would fail the test against the fork's own production string. Product-name only, the same axis brand-sweep.yaml authorises for managed_node.rs; it has to be at this path because the assertion is an inline literal in this test file."
    owner: "vingilot/brand"
    removable_when: "managed_node.rs's product-name strings stop being brand-swept, or upstream stops asserting the hint text verbatim."
    status: "permanent"
    added: "2026-08-13"

  - path: "desktop/src/features/agents/ui/RestartDiffBadge.tsx"
    reason: "One product-name string, forced by the brand sweep. Upstream 0.5.11 extracted the auto-restart blurb into this new file's AUTO_RESTART_ON_BLURB constant ('… Buzz can restart it automatically after ~3 minutes idle …'), which UserProfilePanelTabs.tsx (a declared brand seam) now renders instead of the inline string the fork had rebranded to Vingilot. The rename follows the constant to its new home so the user-facing copy stays Vingilot. Product-name only, the same axis brand-sweep.yaml authorises across the desktop UI; it has to be at this path because the string is an inline literal in this new file."
    owner: "vingilot/brand"
    removable_when: "Upstream stops holding the blurb as a product-named constant, or the brand sweep is retired."
    status: "permanent"
    added: "2026-08-13"

  - path: "desktop/src/features/sidebar/ui/AppSidebar.types.ts"
    reason: "AppSidebar's ratchet split. The merge left AppSidebar.tsx at 1004 lines — all six new lines upstream's own growth — and the fork's rule is split, never raise: the 93-line AppSidebarProps type moved into this file, which already held the sidebar's shared types (CollapsibleSidebarGroup, CreateChannelKind). No behavior moved; AppSidebar.tsx imports the type back and sits at 897. An upstream edit to either file conflicts here, and the resolution re-applies the split: upstream's props changes land in this file's AppSidebarProps, not back in the component."
    owner: "vingilot/runs"
    removable_when: "Upstream splits AppSidebar itself, or the fork's single-sidebar rework (owner queue) replaces the component."
    status: "temporary"
    added: "2026-08-13"

  - path: "desktop/tests/e2e/buzz-term-wheel.spec.ts"
    reason: "Upstream's Buzz Term wheel spec, kept beside the fork's own. Upstream 0.5.11 added desktop/tests/e2e/terminal-wheel.spec.ts (233 lines, asserting a wheel over the Buzz Term dock reaches terminal_scroll) at the exact path the fork already ships a different terminal-wheel.spec.ts (364 lines, asserting a wheel over the vingilot_pty terminal) — an add/add collision of two genuinely different tests. Rather than lose either coverage, upstream's file is renamed to this path and the fork's keeps terminal-wheel.spec.ts; both globs are unioned into playwright.config.ts's testMatch. It lives at the upstream-owned desktop/tests/e2e/ path for the same reason every fork spec does: that is where playwright.config.ts's testDir points. The content is upstream's, unedited apart from the filename."
    owner: "vingilot/runs"
    removable_when: "Upstream renames or removes its Buzz Term wheel spec so the path no longer collides, or the fork's own terminal-wheel spec is removed."
    status: "permanent"
    added: "2026-08-13"

  - path: "desktop/tests/e2e/composer-link-shortcut.spec.ts"
    reason: "Three inverted assertions, forced by the ⌘K unification meeting upstream's own ⌘K spec in the merge. Upstream's composer-link-shortcut spec encodes PRE-palette ⌘K: it asserts that a bare caret, a caret-only-with-text, and a focus outside the composer all fall through to upstream's app-wide quick-search dialog (search-dialog-input visible). The fork's ⌘K is the ShellPalette app-wide (the root.tsx seam in vingilot/seams.yaml; vingilot/docs/plans/2026-08-12-an-ide-of-a-kind.md Task 2), and the composer keeps the chord only where the link editor applies — text selected or caret inside a link — exactly the condition features/runs/lib/composerClaim.ts's composerHoldsGo reads. So in all three of those states the palette opens and search-dialog-input never appears. The merge resolution keeps upstream's three scenarios intact and inverts only their expectations: `palette` visible, `search-dialog-input` absent — the same inversion workspace-palette.spec.ts's 'primary+K is this palette everywhere else too' already carries and the same one the composerClaim/paletteKeys headers document. The first two scenarios (selected text opens Add link, caret-inside-link opens Edit link) are upstream's unchanged and still pass. It lives at the upstream-owned desktop/tests/e2e/ path because that is where playwright.config.ts's testDir points; only the three fall-through expectations are the fork's."
    owner: "vingilot/runs"
    removable_when: "Never, while ⌘K is the palette app-wide. It shrinks to nothing the day upstream retires its own quick-search-on-⌘K assertions or adopts an app-wide palette itself."
    status: "permanent"
    added: "2026-08-13"

  - path: "desktop/tests/e2e/smoke.spec.ts"
    reason: "Search-open path inverted, same axis as composer-link-shortcut.spec.ts above. Upstream's smoke suite opened the sidebar search dialog by dispatching ⌘K and asserting search-results/search-dialog-input focus (the focusSidebarSearchWithShortcut helper). The fork's ⌘K is the ShellPalette app-wide (root.tsx seam; paletteKeys.ts), so that dispatch now opens the palette and never the search dialog. Search moved to its own surface — the sidebar's 'Search everything' button, which ShellPalette.tsx's header calls out as one click away on every route — so the helper (renamed openSidebarSearch) clicks that button instead of pressing ⌘K, and the two scenarios that were genuinely about a keyboard shortcut invert to the palette: the collapsed-sidebar case asserts `palette` visible (not search-dialog-input), exactly the composer-link-shortcut inversion. Every search result / scope / navigation assertion is upstream's unchanged. It lives at the upstream-owned desktop/tests/e2e/ path because that is where playwright.config.ts's testDir points; only the open-search gesture is the fork's."
    owner: "vingilot/runs"
    removable_when: "Never, while ⌘K is the palette app-wide. It shrinks to nothing the day upstream adopts an app-wide palette itself or moves its own search off ⌘K."
    status: "permanent"
    added: "2026-08-13"

  - path: "desktop/tests/e2e/navigation.spec.ts"
    reason: "One inverted open-search gesture, same ⌘K axis as smoke.spec.ts above. Upstream's 'settings shortcut returns without opening search dialog' test opened search by dispatching ⌘K (to make the search focus-request counter non-zero) before checking that a settings round-trip does not resurrect the dialog. The fork's ⌘K is the palette (root.tsx seam; paletteKeys.ts), so search opens through its own 'Search everything' button; the test now clicks that button and keeps its real subject — that returning from Settings must not spuriously reopen search — unchanged. It lives at the upstream-owned desktop/tests/e2e/ path because that is where playwright.config.ts's testDir points; only the open-search gesture is the fork's."
    owner: "vingilot/runs"
    removable_when: "Never, while ⌘K is the palette app-wide. It shrinks to nothing the day upstream adopts an app-wide palette itself or moves its own search off ⌘K."
    status: "permanent"
    added: "2026-08-13"

  - path: "desktop/tests/e2e/search-scope-screenshots.spec.ts"
    reason: "Two inverted open-search gestures, same ⌘K axis as smoke.spec.ts above. This upstream #5306 spec opens the global search dialog by pressing ⌘K, twice, to exercise the current-channel and DM scope actions. The fork's ⌘K is the palette (root.tsx seam; paletteKeys.ts), so the dialog never opens that way; both presses become clicks on the sidebar's 'Search everything' button, which opens the same global dialog with the same channel-scope control. Every scope / chip / screenshot assertion is upstream's unchanged. It lives at the upstream-owned desktop/tests/e2e/ path because that is where playwright.config.ts's testDir points; only the open-search gesture is the fork's."
    owner: "vingilot/runs"
    removable_when: "Never, while ⌘K is the palette app-wide. It shrinks to nothing the day upstream adopts an app-wide palette itself or moves its own search off ⌘K."
    status: "permanent"
    added: "2026-08-13"

  - path: "desktop/tests/e2e/identity-lost.spec.ts"
    reason: "One test's onboarding-gate styling assertions inverted to the sea backdrop (vingilot/seams/sea-backdrop.yaml is the axis; vingilot/docs/plans Task #2). Upstream's 'normal first launch' test pins the machine-onboarding gate's PRE-rebrand chartreuse theme — background-color rgb(215,215,46), a dot-grid radial-gradient, ink rgb(23,23,23), and a chartreuse→light-blue gradient after the click. The fork mounts OnboardingSeaBackdrop on every machine-onboarding stage (MachineOnboardingFlow.tsx; the full contract lives in the fork's own green onboarding-sea-backdrop.spec.ts, and onboarding.spec.ts dropped the same chartreuse assertions), so the chartreuse fill is gone and the gate reads rgb(37,48,51). This inverts only that one test's visual assertions to pin the sea video + poster instead; the identity-persistence subject of the test (get_identity called, persist_current_identity not) is upstream's unchanged. It lives at the upstream-owned desktop/tests/e2e/ path because that is where playwright.config.ts's testDir points; only the backdrop assertions are the fork's."
    owner: "vingilot/onboarding"
    removable_when: "The onboarding sea backdrop is retired, or upstream adopts the same backdrop on its machine-onboarding shell."
    status: "permanent"
    added: "2026-08-13"

  - path: "desktop/tests/e2e/welcome-agent-modal-screenshots.spec.ts"
    reason: "One product-name string inverted to the fork's starter crew (vingilot/seams/the-crew.yaml is the axis; the crew is Navigator/Bosun/Lookout/Scribe). Upstream's welcome chat-first creation test asserts the seeded prompt 'Fizz, help me create a new agent.'; the fork's welcome guide agent is Navigator (welcomeGuide.ts's WELCOME_GUIDE_AGENT_NAME), so useWelcomeAgentCreate.ts emits '@Navigator, help me create a new agent.' and the assertion follows the crew name. Product/crew-name only, the same axis the-crew.yaml authorises; it lives at the upstream-owned desktop/tests/e2e/ path because that is where playwright.config.ts's testDir points."
    owner: "vingilot/brand"
    removable_when: "The fork's starter crew is renamed back, or upstream adopts the same welcome guide agent name."
    status: "permanent"
    added: "2026-08-13"
