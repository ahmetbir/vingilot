# ==============================================================================
# Vingilot seam inventory — fragment: the terminal, after v1.2.1
# ==============================================================================
#
# A fragment of vingilot/seams.yaml, not a file with rules of its own. The
# format, the meaning of a pattern, and the reason any of this exists are all
# documented in the header of vingilot/seams.yaml — read that first; this file
# only holds entries.
#
# Scope: the owner's reports on the terminal after using v1.2.1 daily —
# "cmd c calismiyor", and the type — where the proof has to live at an
# upstream-owned path.

entries:
  - path: "desktop/tests/e2e/terminal-clipboard.spec.ts"
    reason: "The xterm half of the copy fix (2026-09-03, 'cmd c calismiyor. kopyalayamiyorum'). Under the tmux backing a drag is a mouse report, tmux copies the text itself and announces it as OSC 52, and the app's xterm had no handler for it — so the bytes arrived and were dropped. desktop/src/features/runs/lib/osc52.ts decodes the sequence (pure, unit-tested there, reads refused), ui/Terminal.tsx registers the handler and hands the text to upstream's own copy_text_to_clipboard command. This spec feeds the sequence over the mock pty and asserts that command was invoked with the decoded text, that the sequence was consumed rather than drawn, and that a read request ('?') produces neither a copy nor a write back to the shell. The tmux half — that tmux really sends the sequence, for a program inside it and for its own drag-end under set-clipboard on — is src-tauri/src/vingilot_pty/live/clipboard.rs against a real tmux 3.6a. Lives at the upstream-owned desktop/tests/e2e/ path for the reason the other fork specs do: that is where playwright.config.ts's testDir points."
    owner: "vingilot/runs"
    removable_when: "If the terminal moves off the tmux backing, or if xterm ships an OSC 52 handler of its own that refuses reads."
    status: "permanent"
    added: "2026-09-03"

  - path: "desktop/tests/e2e/worktree-switcher.spec.ts"
    reason: "The terminal's context header, end to end (2026-09-03; his second report through the feedback drop — 'Worktree bir tab değil, terminalin çalıştığı bağlam olmalı'). The first cut of the hero strip put every open worktree on the tab strip as a chip; the report said, correctly, that this duplicated the sidebar and mixed levels on one bar, and it was replaced the same evening. This spec asserts what replaced it: no worktree chips on the strip; the header reads the worktree's name (repo/worktree, or the branch of a provisioned checkout); the switcher lists Recent (where he was just before, the current one left out) then this project's worktrees with their ⌘-digit; choosing one switches the terminal to that worktree's sessions with their names intact; the filter narrows and Enter takes the first match; and ⌘K lists the most recent worktree first. The pure halves are desktop/src/features/runs/lib/recentWorktrees.test.mjs, recentWorktreesStore.test.mjs and worktreeLabel.test.mjs. Lives at the upstream-owned desktop/tests/e2e/ path for the reason the other fork specs do: that is where playwright.config.ts's testDir points."
    owner: "vingilot/runs"
    removable_when: "If the terminal stops being per-worktree."
    status: "permanent"
    added: "2026-09-03"

  - path: "desktop/tests/e2e/home-landing.spec.ts"
    reason: "Where the workspace opens (2026-09-04; 'deck landing page kismi tam bi faia ... olmasa daha iyi olur'). With a remembered worktree the workspace still knows, /workspace opens on it — the terminal he left — and the Deck board is not drawn; with no memory, or a memory of a worktree that is gone, the board is the landing it always was and the Deck row still reaches it. The rule is desktop/src/features/runs/lib/homeLanding.ts (unit-tested) and it runs once, inside useWorkspaceSelection.ts, which is RunsScreen's selection cluster split out at the 1000-line ratchet. The memory is seeded through addInitScript before installMockBridge for the reason the repo's guide gives. Lives at the upstream-owned desktop/tests/e2e/ path for the reason the other fork specs do: that is where playwright.config.ts's testDir points."
    owner: "vingilot/runs"
    removable_when: "If the workspace stops remembering where he was."
    status: "permanent"
    added: "2026-09-04"

  - path: "desktop/tests/e2e/diff-base-picker.spec.ts"
    reason: "The Diff pane's base picker (2026-09-04; 'git ile commit diff yaptik, branch comparison filan da yapabilelim ... main ile worktree difi vs. configurable bisi istiyom'). The diff itself needed no new command — `git diff <base> --` already takes any revision expression, `main...HEAD` included — so what was built is the way to reach those spellings: src-tauri/src/vingilot_worktree/refs.rs lists the branches and the default (one read, nothing written), desktop/src/features/runs/lib/diffBase.ts turns them into rows (unit-tested), DiffBasePicker.tsx draws them beside the free box, and diffBasePrefs.ts remembers the choice per worktree. This spec asserts the rows git's refs make, that the branch he is on is not offered against itself, that a row reads at once in the merge-base spelling, that the choice survives a reload, that the filter narrows, and that the free box still takes anything. Lives at the upstream-owned desktop/tests/e2e/ path for the reason the other fork specs do: that is where playwright.config.ts's testDir points."
    owner: "vingilot/runs"
    removable_when: "With the Diff pane."
    status: "permanent"
    added: "2026-09-04"

  - path: "desktop/tests/e2e/worktree-history.spec.ts"
    reason: "⌘[ / ⌘] walking worktrees (2026-09-04; his brief's 'önceki/sonraki worktree geçmişi'). Measured before building: those chords are upstream's app-wide history (app/navigation/backForwardChords.ts, useBackForwardControls.ts) and the top chrome's arrows press the same thing, so claiming them in the workspace would break upstream's navigation in silence. Instead the selected worktree is mirrored into /workspace?wt=… (features/runs/lib/useWorktreeUrlSync.ts; the route's validateSearch admits only wt) and going back through the one history lands on the worktree that was there — through upstream's listener, arrows and navigation guard. This spec asserts ⌘[ / ⌘] and both arrows walk worktrees, and that the first landing replaces rather than pushes so back from it does not land on a blank workspace. Lives at the upstream-owned desktop/tests/e2e/ path for the reason the other fork specs do: that is where playwright.config.ts's testDir points."
    owner: "vingilot/runs"
    removable_when: "If upstream's history stops being the app's back/forward."
    status: "permanent"
    added: "2026-09-04"

  - path: "desktop/tests/e2e/pinned-worktrees.spec.ts"
    reason: "Pinned worktrees (2026-09-04; his brief's '⌘1–5: pinned worktree'lere doğrudan geç ... ziyaret edilen her worktree otomatik tab olmamalı'). A pin moves the worktree to right after the project's checkout, in pin order, whatever its attention state, so its ⌘ digit stays put — the one order (features/runs/lib/worktreeAttention.ts orderWorktrees, now taking the pins) feeds the nav, the digits, the switcher's Pinned group and ⌘K, so there is no second list. The store is features/runs/lib/pinnedWorktrees.ts (per machine, diffMode.ts's shape; parse and toggle unit-tested). This spec asserts the row's pin moves it and re-digits its neighbours, ⌘2 then opens it from the terminal, the switcher groups it under Pinned, the pin survives a reload, and unpinning restores the attention order. Lives at the upstream-owned desktop/tests/e2e/ path for the reason the other fork specs do: that is where playwright.config.ts's testDir points."
    owner: "vingilot/runs"
    removable_when: "If the nav's order stops being the ⌘-digit order."
    status: "permanent"
    added: "2026-09-04"
