# only holds entries.
#
# Scope of this fragment (vingilot/design/mockup/DIFF-TAB-BRIEF.md, and the
# owner's clarification of 2026-08-31 at the bottom of it):
#
#   P4.6 — the diff stops being a patch box and becomes the mockup's `.dv`
#          SURFACE: a commit header with provenance and a change-ratio bar, a
#          toolbar (Unified/Split, Ignore whitespace, Wrap, Expand all, Next
#          change, Review…), one elevated card per file in a scroller, rows
#          with word-level highlighting from a real intra-line differ, the
#          local review agent's notes rendered inside the code, and a footer
#          that tallies what is on screen. "verify'a gecti ama hala iyi degil
#          be" / "hala cok terminal gibi".
