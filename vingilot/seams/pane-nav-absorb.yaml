# ==============================================================================
# Vingilot seam inventory — fragment: pane nav-halves absorbed into the sidebar
# ==============================================================================
#
# A fragment of vingilot/seams.yaml, not a file with rules of its own. The
# format, the meaning of a pattern, and the reason any of this exists are all
# documented in the header of vingilot/seams.yaml — read that first; this file
# only holds entries.
#
# Scope of this fragment: the Files and History panes' list halves move into
# the Deck sidebar's contextual region as members of a single-open accordion
# (vingilot/docs/plans/2026-08-14-pane-nav-absorb.md), plus the owner's
# amendment adding a fourth member — Chats, the existing channel/DM lists,
# reached from the Deck ("deckten geri channellari ve dmleri gormek icin
# agents'a ya da inboxa basmak gerekiyo"). Four members: Worktrees (the
# existing WorkspaceNav portal payload, unchanged), Files (the tree that lived
# inside FilesPane), History (the status+commit lists that lived inside
# HistoryPane), Chats (AppSidebar's own channel fragment, portalled). Exactly
# one member is expanded at a time; collapsed members shrink to a sticky
# ~32px header, never unmount.
#
# Deliberately NOT touched, recorded as decisions:
# - desktop/src/features/runs/lib/diffLayout.ts — not edited. It lost two of
#   its three diffListPlacement callers (FilesPane, HistoryPane) and keeps the
#   third (WorktreeDiffPanel) plus every caller of the unrelated 695px
#   split-render threshold. diffListPlacement is now a one-consumer function
#   with generality knobs tuned for three panes; consolidating that is a
#   separate, later decision (plan §3.2, §8) — said here so the drift is a
#   registry fact rather than an unremarked smell.
# - desktop/src/shared/lib/sidebarNavSlot.ts — mechanism unchanged: still one
#   unnamed slot carrying exactly one payload (now SidebarDeckSections, the
#   accordion, instead of bare WorkspaceNav). It did not become a keyed
#   registry; the Chats amendment got its own module instead (two mechanisms
#   with one payload each, not one with two).
# - The History pane's window-level j/k listener is DELETED, not moved: the
#   sidebar list's scoped onKeyDown is the keystroke's single owner (plan
#   §3.3); the pane has no rows left to walk.

seams:
  - path: "desktop/src/features/sidebar/ui/SidebarAccordionSection.tsx"
    reason: "New, fork-owned: the generic single-open accordion-section primitive (plan §2.4) — sticky ~32px header, aria-expanded/aria-controls, controlled openId/onOpenChange held by the parent, body hidden-not-unmounted so member state survives a collapse. Deliberately NOT a genericized SidebarSection: that component is hard-typed to Channel[] and the whole channel list depends on it; two consumers is not the third strike. resolveAccordionOpen (exported, unit-tested) keeps exactly one member open, always."
    owner: "vingilot/runs"
    removable_when: "Never, while the Deck sidebar keeps an accordion contextual region."
    status: "permanent"
    added: "2026-08-14"

  - path: "desktop/src/features/sidebar/ui/SidebarAccordionSection.test.mjs"
    reason: "New: the single-open rule's DOM-less unit test — one open member under a shared openId, clicking the open header is a no-op (never zero open). The DOM half (collapsed body stays mounted, tree state survives) is sidebar-deck-accordion.spec.ts's."
    owner: "vingilot/runs"
    removable_when: "With SidebarAccordionSection.tsx."
    status: "permanent"
    added: "2026-08-14"

