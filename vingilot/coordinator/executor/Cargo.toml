[package]
name = "vingilot-executor"
version = "0.1.0"
edition = "2021"
license = "Apache-2.0"

[dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "fs"] }
# reqwest is allowed in this crate only (plan's Global Constraints): rustls
# (no openssl), blocking feature OFF (the executor is async top to bottom).
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[dev-dependencies]
vingilot-coordinator = { path = "../coordinator" }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util", "test-util"] }
axum = "0.8"
sqlx = { version = "0.8", features = ["runtime-tokio", "postgres", "uuid", "chrono", "json"] }
tempfile = "3"
